<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMC Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
#svc{--navy:#1F3864;--ink:#1a1a1a;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7fb;--A:#2A78D6;--P:#EB6834;--C:#7A5CC7;--L:#9aa3b2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:13px}
#svc *{box-sizing:border-box}
#svc .hd{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#svc .hd h1{font-size:17px;margin:0;font-weight:650}
#svc .hd p{margin:2px 0 0;font-size:11.5px;opacity:.75}
#svc .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border:1px solid #cfd6e4;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
#svc .btn.pri{background:#2A78D6;color:#fff;border-color:#2A78D6}
#svc .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#svc .btn.sm{padding:4px 8px;font-size:11.5px}
#svc .btn svg,#svc .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#svc .bar{padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#svc .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#svc .grp>label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
#svc .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:#374151}
#svc .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
#svc select,#svc input[type=text],#svc input[type=number],#svc input[type=month]{border:1px solid #d5dae3;border-radius:7px;padding:5px 8px;font-size:12.5px;background:#fff}
#svc .tabs{padding:0 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto}
#svc .tab{padding:11px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
#svc .tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:650}
#svc .main{padding:18px 22px;max-width:none}
#svc .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
#svc .card h3{margin:0 0 4px;font-size:14px;color:var(--navy)}
#svc .sub{color:var(--mut);font-size:12px;margin:0 0 10px}
#svc .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
#svc .kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--L)}
#svc .kpi .l{font-size:11px;color:var(--mut)} #svc .kpi .v{font-size:20px;font-weight:700;margin-top:2px}
#svc .kpi .d{font-size:11.5px;margin-top:2px} #svc .up{color:#c2410c} #svc .dn{color:#15803d}
#svc .tw{overflow-x:auto}
#svc table{border-collapse:collapse;width:100%;font-size:12.5px}
#svc th{background:var(--navy);color:#fff;padding:7px 7px;text-align:center;font-weight:600;white-space:nowrap}
#svc th:first-child,#svc td:first-child{text-align:left}
#svc td{padding:6px 7px;text-align:center;border-bottom:1px solid #eef0f4;white-space:nowrap}
#svc tr.tot td{background:#f2f2f2;font-weight:700}
#svc .note{border-left:3px solid #D9822B;background:#fff8ef;color:#6b4a00;padding:8px 12px;border-radius:0 8px 8px 0;font-size:12px;margin:10px 0}
#svc .empty{padding:60px 20px;text-align:center;color:var(--mut)}
#svc .drop{border:2px dashed #b9c3d8;border-radius:14px;padding:34px;text-align:center;background:#fff;max-width:640px;margin:30px auto}
#svc .grid2{display:grid;grid-template-columns:1fr;gap:12px}   /* chart on top, month table full width below */ @media(max-width:1000px){#svc .grid2{grid-template-columns:1fr}}
#svc .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#svc .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef2ff;color:#3730a3}
#svc .status{font-size:11.5px;opacity:.9}
#svc .x{cursor:pointer;color:#b91c1c}
</style>
</head>
<body>
<div id="svc"></div>

<script id="core">
var SVCCore = (function(){
  var NORM = function(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); };
  var CITY = {BANGALORE:'BLR',BENGALURU:'BLR',BLR:'BLR',NCR:'NCR',DELHI:'NCR','DELHI NCR':'NCR',HYDERABAD:'HYD',HYD:'HYD',MUMBAI:'MUM',MUM:'MUM'};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ALIASES = {
    reg:['reg number','reg_number','jc_reg number','registration number'],
    city:['city','jc_city','city_jc'],
    desc:['spd/lab.description','spd/lab description','part description','part'],
    cat:['category'],
    amt:['amount'],
    issue:['issue catg','issue catg.','issue category','issue_catg'],
    qty:['qty','quantity'],
    jc:['job no','job card id','jc_job card id','job card id_jc','job card id_jc '],
    hub:['jc_hub name','hub name','hub'], loc:['location'],
    model:['model','model name','jc_bike model','bike model'],
    date:['cm/dm date','jc_billed date','job card billed date','billing date','billed date'],
    month:['month']
  };
  function hdr(h){ return String(h==null?'':h).trim().toLowerCase().replace(/\s+/g,' '); }
  function detectCols(header){
    var h = header.map(hdr), ix = {};
    Object.keys(ALIASES).forEach(function(k){
      for (var i=0;i<ALIASES[k].length;i++){ var p=h.indexOf(ALIASES[k][i]); if (p>=0){ ix[k]=p; break; } }
    });
    return ix;
  }
  function mk(y,m){ return y+'-'+(m<10?'0':'')+m; }
  function parseMonth(v){
    if (v==null || v==='') return null;
    if (v instanceof Date) return mk(v.getFullYear(), v.getMonth()+1);
    if (typeof v==='number'){ var d=new Date(Math.round((v-25569)*86400*1000)); return mk(d.getUTCFullYear(), d.getUTCMonth()+1); }
    var s=String(v).trim(), m;
    if ((m=s.match(/^([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})$/))){ var mi=MON.map(function(x){return x.toUpperCase();}).indexOf(m[1].toUpperCase()); if(mi>=0){ var yy=+m[2]; if(yy<100) yy+=2000; return mk(yy,mi+1);} }
    if ((m=s.match(/(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})/))){ var mj=MON.map(function(x){return x.toUpperCase();}).indexOf(m[2].toUpperCase()); if(mj>=0){ var y2=+m[3]; if(y2<100) y2+=2000; return mk(y2,mj+1);} }
    if ((m=s.match(/^(\d{4})-(\d{2})/))) return mk(+m[1], +m[2]);
    if ((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return mk(+m[3], +m[2]);
    return null;
  }
  function monthLabel(k){ var p=k.split('-'); return MON[+p[1]-1]+'-'+p[0].slice(2); }
  function titleCase(s){ return String(s).toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,function(a,b,c){return b+c.toUpperCase();}); }
  function newStore(){ return {rows:[], names:{}, jc:{}, files:[]}; }

  function ingest(rows, header, store, fileName){
    var ix = detectCols(header), need=['city','desc','cat','amt','issue'], miss=need.filter(function(k){return ix[k]==null;});
    if (miss.length) throw new Error('Could not find column(s): '+miss.join(', ')+'. Is this the JC line-level export?');
    if (ix.month==null && ix.date==null) throw new Error('Could not find a date or month column.');
    var agg={}, names={}, jcs={}, covered={}, skipped=0, used=0;
    for (var i=0;i<rows.length;i++){
      var r=rows[i]; if(!r) continue;
      var city=CITY[String(r[ix.city]==null?'':r[ix.city]).trim().toUpperCase()]; if(!city){skipped++;continue;}
      var month = ix.month!=null ? parseMonth(r[ix.month]) : null;
      if(!month && ix.date!=null) month=parseMonth(r[ix.date]);
      if(!month){skipped++;continue;}
      var c=String(r[ix.cat]==null?'':r[ix.cat]).trim().toLowerCase(), cat = c==='part'?'Part': c==='labour'||c==='labor'?'Labour':null;
      if(!cat){skipped++;continue;}
      var issue=String(r[ix.issue]==null?'':r[ix.issue]).trim().toUpperCase()||'NA';
      var amt=+r[ix.amt]||0, qty= ix.qty!=null ? (+r[ix.qty]||0) : 0;
      var hub= ix.hub!=null ? String(r[ix.hub]==null?'':r[ix.hub]).trim() : '';
      if(!hub && ix.loc!=null){ var lc=String(r[ix.loc]==null?'':r[ix.loc]).replace(/^WICKEDRIDE\s+WR_/i,'').trim(); hub=({ECITY:'Electronic City',FATHENAGAR:'Fathe nagar',HEBBALA:'Hebbal',INDRANAGAR:'Indiranagar',MIYAPUR:'Miyapur',RSA:'RSA Team',SAKINAKA:'Sakinaka'})[lc.toUpperCase()]||lc; }
      var model= ix.model!=null ? String(r[ix.model]==null?'':r[ix.model]).trim() : '';
      var raw=String(r[ix.desc]==null?'':r[ix.desc]).trim(), pn = cat==='Part' ? NORM(raw) : 'LABOUR';
      if(cat==='Part' && !names[pn]) names[pn]=titleCase(raw);
      var key=[city,month,hub,model,issue,cat,pn].join('|');
      var e=agg[key]; if(!e){ e=agg[key]={city:city,month:month,hub:hub,model:model,issue:issue,cat:cat,pn:pn,amt:0,qty:0}; }
      e.amt+=amt; e.qty+=qty; used++; covered[city+'|'+month]=1;
      if(cat==='Part' && ix.jc!=null && r[ix.jc]!=null){ var jk=city+'|'+month; (jcs[jk]=jcs[jk]||{})[r[ix.jc]]=1; }
    }
    store.rows = store.rows.filter(function(x){ return !covered[x.city+'|'+x.month]; });
    Object.keys(agg).forEach(function(k){ store.rows.push(agg[k]); });
    Object.keys(names).forEach(function(p){ if(!store.names[p]) store.names[p]=names[p]; });
    Object.keys(covered).forEach(function(k){ delete store.jc[k]; });
    Object.keys(jcs).forEach(function(k){ store.jc[k]=Object.keys(jcs[k]).length; });
    var months=Object.keys(covered).map(function(k){return k.split('|')[1];}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
    store.files.push({name:fileName, rows:used, months:months, at:new Date().toISOString()});
    return {rows:used, skipped:skipped, months:months, cities:Object.keys(covered).map(function(k){return k.split('|')[0];}).filter(function(v,i,a){return a.indexOf(v)===i;})};
  }

  function defaultRules(){
    var P=['FRONT FORK SUB ASSEMBLY-MW - DRUM','MCU - 60A','POWER HARNESS E.1 WITH LINGBO 60A','FRONT BRAKE CALIPER','FRONT FORK SUB ASSEMBLY','HEAD LAMP','REAR RIM WITH MOTOR 12INCH, M18 HEX NUT(','REAR SUSPENSION','MOTOR HM124811 DISC','BLDC MOTOR 12 INCH 48V 1.2KW','SUSPENSION-T-STEAM','ALLOY WHEEL 12 INC','THROTTLE ASSEMBLY'];
    var C=['FLOOR UNDER COVER B','IOT DEVICE - INTELLICAR','REFURBISHED - IOT DEVICE - INTELLICAR','HEAD LIGHT LOWER COVER-MOULDING PC'];
    var C9=['POWER CONNECTOR WITH FASTENERS','MAIN HARNESS E.1 LINGBO 60 A','DC-DC CONVERTER','SWITCH ASSY. RIGHT E.1','CBS VALVE','MAIN WIRE HARNESS - E.1+ MOON','SPEEDOMETER SUB ASSEMBL - E.1','MASTER CYLINDER HANDLE*','DIU UNIT'];
    return P.map(function(n){return {name:n,to:'P',from:''};}).concat(C.map(function(n){return {name:n,to:'C',from:''};})).concat(C9.map(function(n){return {name:n,to:'C',from:'2026-09'};}));
  }
  function compileRules(rules){
    var list=rules.map(function(r){ return {k:NORM(String(r.name).replace(/\*\s*$/,'')), w:/\*\s*$/.test(r.name), to:r.to, from:r.from||''}; }), cache={};
    return function(pn, month){
      var ck=pn+'|'+month; if(cache[ck]) return cache[ck];
      var res='A';
      for(var i=0;i<list.length;i++){ var r=list[i]; if(r.from && month<r.from) continue; if(r.w ? pn.indexOf(r.k)===0 : pn===r.k) res=r.to; }
      return (cache[ck]=res);
    };
  }
  function buildFold(names, on){
    var map={}, pns=Object.keys(names), bases=pns.filter(function(p){return p.indexOf('REFURB')<0;});
    pns.forEach(function(p){
      var lab=names[p];
      if(!on || p.indexOf('REFURB')<0){ map[p]={key:p,label:lab}; return; }
      var core=p.replace(/REFURBISHED|REFURB/g,''), alt=core.replace(/ASSY/g,'ASSEMBLY'), best=null;
      [core,alt].forEach(function(c){
        if(best || c.length<8) return;
        var cands=bases.filter(function(b){return b===c||b.indexOf(c)===0;});
        if(cands.length){ cands.sort(function(a,b){return a.length-b.length;}); best=cands[0]; }
      });
      map[p]= best ? {key:best,label:names[best]} : {key:p,label:lab};
    });
    return map;
  }
  function compute(store, ctx, F){
    var out={};
    for(var i=0;i<store.rows.length;i++){
      var r=store.rows[i];
      if(F.cities.indexOf(r.city)<0) continue;
      if(F.months.length && F.months.indexOf(r.month)<0) continue;
      if(F.hub && r.hub!==F.hub) continue;
      if(F.model && r.model!==F.model) continue;
      var b;
      if(r.cat==='Labour') b='L'; else if(r.issue==='P') b='P'; else if(r.issue==='A') b=ctx.rule(r.pn,r.month); else if(r.issue==='W') b='W'; else if(r.issue==='F') b='F'; else continue;
      var o=out[r.city]||(out[r.city]={}), m=o[r.month]||(o[r.month]={A:0,P:0,C:0,L:0,W:0,F:0,parts:{A:{},P:{},C:{}}});
      m[b]+=r.amt;
      if(b!=='L' && b!=='W' && b!=='F'){
        var f=ctx.fold[r.pn]||{key:r.pn,label:r.pn}, pm=m.parts[b], e=pm[f.key]||(pm[f.key]={label:f.label,amt:0,qty:0});
        e.amt+=r.amt; e.qty+=r.qty;
      }
    }
    return out;
  }
  function parseStatus(rows, header){
    var h=header.map(hdr), ci=h.indexOf('city_name'), hi=h.indexOf('hub_name'); if(ci<0) throw new Error('Could not find city_name column. Is this the bike status file?');
    var mcols=[]; h.forEach(function(x,i){ var m=x.match(/^([a-z]+)_(\d{4})_km$/); if(m){ var mi=MON.map(function(z){return z.toLowerCase();}).indexOf(m[1].slice(0,3)); if(mi>=0) mcols.push({i:i,key:mk(+m[2],mi+1)}); } });
    var km={}, fleet={}, hubFleet={}, hubKm={};
    rows.forEach(function(r){
      if(!r) return; var city=CITY[String(r[ci]==null?'':r[ci]).trim().toUpperCase()]; if(!city) return;
      var hub= hi>=0 ? String(r[hi]==null?'':r[hi]).trim() : '';
      fleet[city]=(fleet[city]||0)+1; if(hub) hubFleet[city+'|'+hub]=(hubFleet[city+'|'+hub]||0)+1;
      mcols.forEach(function(mc){ var v=+r[mc.i]||0; (km[city]=km[city]||{})[mc.key]=((km[city]||{})[mc.key]||0)+v; if(hub){ var k=city+'|'+hub+'|'+mc.key; hubKm[k]=(hubKm[k]||0)+v; } });
    });
    var latest=null; mcols.forEach(function(mc){ var t=0; Object.keys(km).forEach(function(c){ t+=(km[c][mc.key]||0); }); if(t>0 && (!latest||mc.key>latest)) latest=mc.key; });
    return {km:km, fleet:fleet, hubFleet:hubFleet, hubKm:hubKm, latest:latest};
  }
  function defaultFleet(){ return {
    BLR:{'2026-01':4030,'2026-02':4379,'2026-03':5208,'2026-04':6272,'2026-05':7149,'2026-06':8193,'2026-07':9069,'2026-08':9959,'2026-09':10173,'2026-10':10400},
    NCR:{'2026-01':1962,'2026-02':2011,'2026-03':2075,'2026-04':2084,'2026-05':2084,'2026-06':2062,'2026-07':2032,'2026-08':2134,'2026-09':2095,'2026-10':2097},
    HYD:{'2026-04':150,'2026-05':307,'2026-06':643,'2026-07':735,'2026-08':795,'2026-09':1019,'2026-10':1174}}; }
  function defaultKm(){ return {
    BLR:{'2026-01':8995829,'2026-02':9266271,'2026-03':12536399,'2026-04':13467616,'2026-05':17175812,'2026-06':19418597,'2026-07':24690036,'2026-08':25281609,'2026-09':25081674,'2026-10':6068048},
    NCR:{'2026-01':4036964,'2026-02':4175102,'2026-03':4777794,'2026-04':4711656,'2026-05':4728624,'2026-06':5224772,'2026-07':5873417,'2026-08':5822235,'2026-09':5186603,'2026-10':1175732},
    HYD:{'2026-04':248074,'2026-05':690958,'2026-06':1511151,'2026-07':1759228,'2026-08':1917248,'2026-09':2410996,'2026-10':720031}}; }
  function defaultOps(){ return {"labour": {"BLR": {"2026-02": 846023, "2026-03": 962959, "2026-04": 1313357, "2026-05": 1357595, "2026-06": 1695951, "2026-07": 2379706, "2026-08": 2414062, "2026-09": 2519000}, "NCR": {"2026-02": 498728, "2026-03": 462725, "2026-04": 487656, "2026-05": 475152, "2026-06": 573236, "2026-07": 713232, "2026-08": 642334, "2026-09": 964304}, "HYD": {"2026-04": 81105, "2026-05": 139163, "2026-06": 145897, "2026-07": 145383, "2026-08": 134991, "2026-09": 190000}}, "other": {"BLR": {"2026-02": 316602, "2026-03": 416119, "2026-04": 696819, "2026-05": 783530, "2026-06": 1534549, "2026-07": 1279636, "2026-08": 1543645, "2026-09": 948692}, "NCR": {"2026-02": 16088, "2026-03": 68475, "2026-04": 279256, "2026-05": 193812, "2026-06": 439206, "2026-07": 363728, "2026-08": 1372162, "2026-09": 181808}, "HYD": {"2026-05": 31283, "2026-06": 54526, "2026-07": 71001, "2026-08": 110823, "2026-09": 80964, "2026-04": 0}}}; }
  return {defaultOps:defaultOps, NORM:NORM, CITY:CITY, detectCols:detectCols, parseMonth:parseMonth, monthLabel:monthLabel, newStore:newStore, ingest:ingest, defaultRules:defaultRules, compileRules:compileRules, buildFold:buildFold, compute:compute, parseStatus:parseStatus, defaultFleet:defaultFleet, defaultKm:defaultKm};
})();
if (typeof module!=='undefined') module.exports = SVCCore;
</script>

var ICON = {

function readSess(){ try{ var ls=localStorage.getItem('sb_session'); if(ls) return {s:JSON.parse(ls),store:localStorage}; var ss=sessionStorage.getItem('sb_session'); if(ss) return {s:JSON.parse(ss),store:sessionStorage}; }catch(e){} return {s:{},store:localStorage}; }
function tokenExpMs(jwt){ try{ var p=JSON.parse(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return p.exp?p.exp*1000:null; }catch(e){ return null; } }
var _refreshing=null;
async function refreshSession(){
  if(_refreshing) return _refreshing;
  _refreshing=(async function(){
    var o=readSess(), s=o.s; if(!s.refresh_token) return null;
    try{
      var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok) return null; var d=await r.json(); if(!d.access_token) return null;
      s=Object.assign({},s,{access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token});
      o.store.setItem('sb_session',JSON.stringify(s)); return s.access_token;
    }catch(e){ return null; }
  })();
  try{ return await _refreshing; } finally { _refreshing=null; }
}
async function validToken(){
  var s=readSess().s; if(!s.access_token) return null;
  var exp=tokenExpMs(s.access_token); if(exp&&exp>Date.now()+30000) return s.access_token;
  return (await refreshSession())||s.access_token;
}
async function api(path,opts){
  opts=opts||{};
  var go=function(tok){ var h={apikey:ANON,Authorization:'Bearer '+tok,'Content-Type':'application/json'}; if(opts.range) { h['Range-Unit']='items'; h.Range=opts.range; } return fetch(SB+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined}); };
  var tok=await validToken(); if(!tok) return {ok:false,status:401,msg:'Please log in to the portal again'};
  var r=await go(tok);
  if(r.status===401){ var nt=await refreshSession(); if(nt) r=await go(nt); }
  if(r.ok){ var t=await r.text(); return {ok:true,data:t?JSON.parse(t):null}; }
  var m=''; try{ var e=await r.json(); m=e.message||''; }catch(x){}
  return {ok:false,status:r.status,msg:m||('HTTP '+r.status)};
}
async function getAll(path){
  var out=[], from=0, size=1000;
  while(true){
    var r=await api(path,{range:from+'-'+(from+size-1)});
    if(!r.ok) return r;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<size) break;
    from+=size;
  }
  return {ok:true,data:out};
}
function rpc(fn,args){ return api('/rest/v1/rpc/'+fn,{method:'POST',body:args||{}}); }

    var jc=Object.keys(tmp.jc).filter(function(k){return k.split('|')[1]===m;}).map(function(k){ return {city:CITY_FULL[k.split('|')[0]],hub:'',total:null,parts:tmp.jc[k]}; });

function stacked(city, months, model){

    +'<input type="file" id="f_jc" accept=".xlsx,.xls,.csv" style="display:none"><input type="file" id="f_st" accept=".xlsx,.xls,.csv" style="display:none">';
}
function toggle(arr,v){ var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }
function csv(){
  var model=addAll(C.compute(state.store,ctx(),state.F)), P=state.parts, ms=selMonths().filter(function(m){return model[P.city]&&model[P.city][m];}), rows=partRows(model,P.city,P.bucket,ms), last=ms[ms.length-1];
  rows.sort(function(a,b){return ((b.by[last]||{amt:0}).amt)-((a.by[last]||{amt:0}).amt);});
  var out=['Part,'+ms.map(C.monthLabel).join(',')]; rows.forEach(function(r){ out.push('"'+r.label.replace(/"/g,'""')+'",'+ms.map(function(m){var v=val(r.by[m]?r.by[m].amt:0,P.city,m);return v==null?'':v;}).join(',')); });
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/csv'})); a.download='parts_'+P.city+'_'+P.bucket+'_'+state.unit+'.csv'; a.click();
}
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return; var a=el.getAttribute('data-a'), v=el.getAttribute('data-v');
  if(a==='tab') state.tab=v;
  else if(a==='city'){ var ac=allCities();
    if(v==='ALL') state.F.cities=ac.slice();
    else if(state.F.cities.length===ac.length) state.F.cities=[v];
    else { toggle(state.F.cities,v); if(!state.F.cities.length) state.F.cities=ac.slice(); }
    state.F.cities=ac.filter(function(c){ return state.F.cities.indexOf(c)>=0; });
    state.parts.city=state.mv.city=state.hubs.city=defCity(); state.F.hub=''; }
  else if(a==='month'){ var all=allMonths(); if(!state.F.months.length) state.F.months=all.slice(); toggle(state.F.months,v); if(!state.F.months.length||state.F.months.length===all.length) state.F.months=[]; }
  else if(a==='unit') state.unit=v;
  else if(a==='pb') state.parts.bucket=v;
  else if(a==='dstat') state.dist.stat=v;
  else if(a==='pickjc'){ document.getElementById('f_jc').click(); return; }
  else if(a==='reload'){ loadAll(); return; }
  else if(a==='csv'){ csv(); return; }
  else if(a==='rdel'){ state.rules.splice(+v,1); saveRules(); }
  else if(a==='radd'){ var n=document.getElementById('rn').value.trim(); if(!n) return; state.rules.push({name:n,to:document.getElementById('rt').value,from:document.getElementById('rf').value||''}); saveRules(); }
  else if(a==='rreset'){ if(!confirm('Reset the rules to the original 26?')) return; state.rules=C.defaultRules(); saveRules(); }
  
  else return;
  render();
});
root.addEventListener('change',function(e){
  var el=e.target, a=el.getAttribute('data-a');
  if(el.id==='f_jc'){ var fl=el.files[0]; if(fl){ toast('Reading '+fl.name+' …'); var fr=new FileReader(); fr.onload=function(){ setTimeout(function(){ uploadDMS(fr.result, fl.name).catch(function(err){ toast('Error: '+err.message); }); },30); }; fr.readAsArrayBuffer(fl); } el.value=''; return; }
  if(a==='opscity'){ state.opsCity=el.value; render(); return; }
  if(a==='opsin'){ var k=el.getAttribute('data-k'), c=el.getAttribute('data-c'), m=el.getAttribute('data-m'), rupees=el.value===''?null:Math.round(parseFloat(el.value)*100000); var o=((state.ops[c]=state.ops[c]||{})[m]=(state.ops[c]||{})[m]||{month:m,city:CITY_FULL[c]}); o[k]=rupees; var vv={}; vv[k]=rupees==null?'':rupees; rpc('rmc_save_ops',{p_month:m,p_city:CITY_FULL[c],p_vals:vv}).then(function(r){ toast(r.ok?'Saved '+k.replace('_',' ')+' · '+CITY_FULL[c]+' '+C.monthLabel(m):'Could not save: '+r.msg); }); return; }
  if(!a) return;
  if(a==='hub') state.F.hub=el.value; else if(a==='model') state.F.model=el.value;
  else if(a==='pcity') state.parts.city=el.value; else if(a==='ptop') state.parts.top=+el.value;
  else if(a==='mcity') state.mv.city=el.value; else if(a==='mb') state.mv.bucket=el.value; else if(a==='mx') state.mv.x=el.value; else if(a==='my') state.mv.y=el.value;
  else if(a==='hcity') state.hubs.city=el.value;
  else if(a==='fold') state.foldOn=el.checked;
  
  render();
});
root.addEventListener('input',function(e){ var el=e.target; if(el.getAttribute&&el.getAttribute('data-a')==='pq'){ state.parts.q=el.value; var pos=el.selectionStart; render(); var n=root.querySelector('[data-a=pq]'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } } });


window.SVC_APP={state:state,importJC:importJC,importStatus:importStatus,render:render};
state.opsCity='BLR';
render();
loadAll();
})();
</script>
