<!DOCTYPE html>
<html lang="en">
<head>
<script src="auth-guard.js"></script><!-- login required (27 Oct 2026): no session -> login page -->
<script src="error-log.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMC Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
#svc{--navy:#1F3864;--ink:#1a1a1a;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7fb;--A:#2A78D6;--P:#EB6834;--C:#7A5CC7;--L:#9aa3b2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:13px}
#svc *{box-sizing:border-box}
#svc .hd{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#svc .hd h1{font-size:17px;margin:0;font-weight:650}
#svc .hd p{margin:2px 0 0;font-size:11.5px;opacity:.75}
#svc .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border:1px solid #cfd6e4;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
#svc .btn.pri{background:#2A78D6;color:#fff;border-color:#2A78D6}
#svc .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#svc .btn.sm{padding:4px 8px;font-size:11.5px}
#svc .btn svg,#svc .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#svc .bar{padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#svc .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#svc .grp>label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
#svc .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:#374151}
#svc .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
#svc select,#svc input[type=text],#svc input[type=number],#svc input[type=month]{border:1px solid #d5dae3;border-radius:7px;padding:5px 8px;font-size:12.5px;background:#fff}
#svc .tabs{padding:0 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto}
#svc .tab{padding:11px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
#svc .tab.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:650}
#svc .main{padding:18px 22px;max-width:none}
#svc .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
#svc .card h3{margin:0 0 4px;font-size:14px;color:var(--navy)}
#svc .sub{color:var(--mut);font-size:12px;margin:0 0 10px}
#svc .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
#svc .kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--L)}
#svc .kpi .l{font-size:11px;color:var(--mut)} #svc .kpi .v{font-size:20px;font-weight:700;margin-top:2px}
#svc .kpi .d{font-size:11.5px;margin-top:2px} #svc .up{color:#c2410c} #svc .dn{color:#15803d}
#svc .tw{overflow-x:auto}
#svc table{border-collapse:collapse;width:100%;font-size:12.5px}
#svc th{background:var(--navy);color:#fff;padding:7px 7px;text-align:center;font-weight:600;white-space:nowrap}
#svc th:first-child,#svc td:first-child{text-align:left}
#svc td{padding:6px 7px;text-align:center;border-bottom:1px solid #eef0f4;white-space:nowrap}
#svc tr.tot td{background:#f2f2f2;font-weight:700}
#svc .note{border-left:3px solid #D9822B;background:#fff8ef;color:#6b4a00;padding:8px 12px;border-radius:0 8px 8px 0;font-size:12px;margin:10px 0}
#svc .empty{padding:60px 20px;text-align:center;color:var(--mut)}
#svc .drop{border:2px dashed #b9c3d8;border-radius:14px;padding:34px;text-align:center;background:#fff;max-width:640px;margin:30px auto}
#svc .grid2{display:grid;grid-template-columns:1fr;gap:12px}   /* chart on top, month table full width below */ @media(max-width:1000px){#svc .grid2{grid-template-columns:1fr}}
#svc .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#svc .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef2ff;color:#3730a3}
#svc .status{font-size:11.5px;opacity:.9}
#svc .x{cursor:pointer;color:#b91c1c}
.hubdd{position:relative}.hubdd>summary{list-style:none;cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:5px 26px 5px 10px;font-size:13px;background:#fff;min-width:140px;position:relative;white-space:nowrap}
.hubdd>summary::-webkit-details-marker{display:none}.hubdd>summary:after{content:'\25BE';position:absolute;right:9px;top:5px;color:#64748b}
.hubpanel{position:absolute;z-index:30;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:8px 10px;min-width:220px;max-height:320px;overflow:auto}
.hubopt{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="svc"></div>

<script id="core">
var SVCCore = (function(){
  var NORM = function(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); };
  var CITY = {BANGALORE:'BLR',BENGALURU:'BLR',BLR:'BLR',NCR:'NCR',DELHI:'NCR','DELHI NCR':'NCR',HYDERABAD:'HYD',HYD:'HYD',MUMBAI:'MUM',MUM:'MUM'};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ALIASES = {
    reg:['reg number','reg_number','jc_reg number','registration number'],
    city:['city','jc_city','city_jc'],
    desc:['spd/lab.description','spd/lab description','part description','part'],
    cat:['category'],
    amt:['amount'],
    issue:['issue catg','issue catg.','issue category','issue_catg'],
    qty:['qty','quantity'],
    jc:['job no','job card id','jc_job card id','job card id_jc','job card id_jc '],
    hub:['jc_hub name','hub name','hub'], loc:['location'],
    model:['model','model name','jc_bike model','bike model'],
    date:['cm/dm date','jc_billed date','job card billed date','billing date','billed date'],
    month:['month']
  };
  function hdr(h){ return String(h==null?'':h).trim().toLowerCase().replace(/\s+/g,' '); }
  function detectCols(header){
    var h = header.map(hdr), ix = {};
    Object.keys(ALIASES).forEach(function(k){
      for (var i=0;i<ALIASES[k].length;i++){ var p=h.indexOf(ALIASES[k][i]); if (p>=0){ ix[k]=p; break; } }
    });
    return ix;
  }
  function mk(y,m){ return y+'-'+(m<10?'0':'')+m; }
  function parseMonth(v){
    if (v==null || v==='') return null;
    if (v instanceof Date) return mk(v.getFullYear(), v.getMonth()+1);
    if (typeof v==='number'){ var d=new Date(Math.round((v-25569)*86400*1000)); return mk(d.getUTCFullYear(), d.getUTCMonth()+1); }
    var s=String(v).trim(), m;
    if ((m=s.match(/^([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})$/))){ var mi=MON.map(function(x){return x.toUpperCase();}).indexOf(m[1].toUpperCase()); if(mi>=0){ var yy=+m[2]; if(yy<100) yy+=2000; return mk(yy,mi+1);} }
    if ((m=s.match(/(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})/))){ var mj=MON.map(function(x){return x.toUpperCase();}).indexOf(m[2].toUpperCase()); if(mj>=0){ var y2=+m[3]; if(y2<100) y2+=2000; return mk(y2,mj+1);} }
    if ((m=s.match(/^(\d{4})-(\d{2})/))) return mk(+m[1], +m[2]);
    if ((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return mk(+m[3], +m[2]);
    return null;
  }
  function monthLabel(k){ var pt=/p$/.test(k), kk=pt?k.slice(0,-1):k, p=kk.split('-');
    // partial periods: the previous month's same days ('2026-09p') and the latest month itself when its data covers only part of it
    if(pt || (window.RMC_LATEST_PARTIAL && k===window.RMC_LATEST_PARTIAL)) return MON[+p[1]-1]+' 1\u2013'+(window.RMC_PARTIAL_DAYS||'');
    return MON[+p[1]-1]+'-'+p[0].slice(2); }
  function titleCase(s){ return String(s).toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,function(a,b,c){return b+c.toUpperCase();}); }
  function newStore(){ return {rows:[], names:{}, jc:{}, files:[]}; }

  function ingest(rows, header, store, fileName){
    var ix = detectCols(header), need=['city','desc','cat','amt','issue'], miss=need.filter(function(k){return ix[k]==null;});
    if (miss.length) throw new Error('Could not find column(s): '+miss.join(', ')+'. Is this the JC line-level export?');
    if (ix.month==null && ix.date==null) throw new Error('Could not find a date or month column.');
    var agg={}, names={}, jcs={}, jcAll={}, bikes={}, covered={}, skipped=0, used=0;
    for (var i=0;i<rows.length;i++){
      var r=rows[i]; if(!r) continue;
      var city=CITY[String(r[ix.city]==null?'':r[ix.city]).trim().toUpperCase()]; if(!city){skipped++;continue;}
      var month = ix.month!=null ? parseMonth(r[ix.month]) : null;
      if(!month && ix.date!=null) month=parseMonth(r[ix.date]);
      if(!month){skipped++;continue;}
      var c=String(r[ix.cat]==null?'':r[ix.cat]).trim().toLowerCase(), cat = c==='part'?'Part': c==='labour'||c==='labor'?'Labour':null;
      if(!cat){skipped++;continue;}
      var issue=String(r[ix.issue]==null?'':r[ix.issue]).trim().toUpperCase()||'NA';
      var amt=+r[ix.amt]||0, qty= ix.qty!=null ? (+r[ix.qty]||0) : 0;
      var hub= ix.hub!=null ? String(r[ix.hub]==null?'':r[ix.hub]).trim() : '';
      if(!hub && ix.loc!=null){ var lc=String(r[ix.loc]==null?'':r[ix.loc]).replace(/^WICKEDRIDE\s+WR_/i,'').trim(); hub=({ECITY:'Electronic City',FATHENAGAR:'Fathe nagar',HEBBALA:'Hebbal',INDRANAGAR:'Indiranagar',MIYAPUR:'Miyapur',RSA:'RSA Team',SAKINAKA:'Sakinaka'})[lc.toUpperCase()]||lc; }
      var model= ix.model!=null ? String(r[ix.model]==null?'':r[ix.model]).trim() : '';
      var raw=String(r[ix.desc]==null?'':r[ix.desc]).trim(), pn = cat==='Part' ? NORM(raw) : 'LABOUR';
      if(cat==='Part' && !names[pn]) names[pn]=titleCase(raw);
      var key=[city,month,hub,model,issue,cat,pn].join('|');
      var e=agg[key]; if(!e){ e=agg[key]={city:city,month:month,hub:hub,model:model,issue:issue,cat:cat,pn:pn,amt:0,qty:0}; }
      e.amt+=amt; e.qty+=qty; used++; covered[city+'|'+month]=1;
      if(cat==='Part' && ix.jc!=null && r[ix.jc]!=null){ var jk=city+'|'+month; (jcs[jk]=jcs[jk]||{})[r[ix.jc]]=1; }
      if(ix.jc!=null && r[ix.jc]!=null){ var jk2=city+'|'+month; (jcAll[jk2]=jcAll[jk2]||{})[r[ix.jc]]=1; }
      if(ix.reg!=null && r[ix.reg]!=null && String(r[ix.reg]).trim()){ var bk=city+'|'+month; (bikes[bk]=bikes[bk]||{})[String(r[ix.reg]).trim().toUpperCase()]=1; }
    }
    store.rows = store.rows.filter(function(x){ return !covered[x.city+'|'+x.month]; });
    Object.keys(agg).forEach(function(k){ store.rows.push(agg[k]); });
    Object.keys(names).forEach(function(p){ if(!store.names[p]) store.names[p]=names[p]; });
    Object.keys(covered).forEach(function(k){ delete store.jc[k]; });
    Object.keys(jcs).forEach(function(k){ store.jc[k]=Object.keys(jcs[k]).length; });
    store.jcAll=store.jcAll||{}; store.bikes=store.bikes||{};
    Object.keys(jcAll).forEach(function(k){ store.jcAll[k]=Object.keys(jcAll[k]).length; });
    Object.keys(bikes).forEach(function(k){ store.bikes[k]=Object.keys(bikes[k]).length; });
    var months=Object.keys(covered).map(function(k){return k.split('|')[1];}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
    store.files.push({name:fileName, rows:used, months:months, at:new Date().toISOString()});
    return {rows:used, skipped:skipped, months:months, cities:Object.keys(covered).map(function(k){return k.split('|')[0];}).filter(function(v,i,a){return a.indexOf(v)===i;})};
  }

  function defaultRules(){
    var P=['FRONT FORK SUB ASSEMBLY-MW - DRUM','MCU - 60A','POWER HARNESS E.1 WITH LINGBO 60A','FRONT BRAKE CALIPER','FRONT FORK SUB ASSEMBLY','HEAD LAMP','REAR RIM WITH MOTOR 12INCH, M18 HEX NUT(','REAR SUSPENSION','MOTOR HM124811 DISC','BLDC MOTOR 12 INCH 48V 1.2KW','SUSPENSION-T-STEAM','ALLOY WHEEL 12 INC','THROTTLE ASSEMBLY'];
    var C=['FLOOR UNDER COVER B','IOT DEVICE - INTELLICAR','REFURBISHED - IOT DEVICE - INTELLICAR','HEAD LIGHT LOWER COVER-MOULDING PC'];
    var C9=['POWER CONNECTOR WITH FASTENERS','MAIN HARNESS E.1 LINGBO 60 A','DC-DC CONVERTER','SWITCH ASSY. RIGHT E.1','CBS VALVE','MAIN WIRE HARNESS - E.1+ MOON','SPEEDOMETER SUB ASSEMBL - E.1','MASTER CYLINDER HANDLE*','DIU UNIT'];
    return P.map(function(n){return {name:n,to:'P',from:''};}).concat(C.map(function(n){return {name:n,to:'C',from:''};})).concat(C9.map(function(n){return {name:n,to:'C',from:'2026-09'};}));
  }
  function compileRules(rules){
    var list=rules.map(function(r){ return {k:NORM(String(r.name).replace(/\*\s*$/,'')), w:/\*\s*$/.test(r.name), to:r.to, from:r.from||'', p:!!r.p}; }), cache={};
    // issue 'A' (default): any matching rule applies. issue 'P': only rules marked "also P-tagged" apply; otherwise P stays P.
    return function(pn, month, issue){
      issue=issue||'A'; var ck=pn+'|'+month+'|'+issue; if(cache[ck]) return cache[ck];
      var res=issue;
      for(var i=0;i<list.length;i++){ var r=list[i]; if(r.from && month<r.from) continue; if(issue==='P' && !r.p) continue; if(r.w ? pn.indexOf(r.k)===0 : pn===r.k) res=r.to; }
      return (cache[ck]=res);
    };
  }
  function buildFold(names, on){
    var map={}, pns=Object.keys(names), bases=pns.filter(function(p){return p.indexOf('REFURB')<0;});
    pns.forEach(function(p){
      var lab=names[p];
      if(!on || p.indexOf('REFURB')<0){ map[p]={key:p,label:lab}; return; }
      var core=p.replace(/REFURBISHED|REFURB/g,''), alt=core.replace(/ASSY/g,'ASSEMBLY'), best=null;
      [core,alt].forEach(function(c){
        if(best || c.length<8) return;
        var cands=bases.filter(function(b){return b===c||b.indexOf(c)===0;});
        if(cands.length){ cands.sort(function(a,b){return a.length-b.length;}); best=cands[0]; }
      });
      map[p]= best ? {key:best,label:names[best]} : {key:p,label:lab};
    });
    return map;
  }
  function compute(store, ctx, F){
    var out={};
    for(var i=0;i<store.rows.length;i++){
      var r=store.rows[i];
      if(F.cities.indexOf(r.city)<0) continue;
      if(F.months.length && F.months.indexOf(r.month)<0) continue;
      if(F.hubs && F.hubs.length && F.hubs.indexOf(r.hub)<0) continue;
      if(F.model && r.model!==F.model) continue;
      var w=F.shareFn?F.shareFn(r):1; if(!w) continue;   // deployed-year filter: this row's share for the chosen year
      var b;
      if(r.cat==='Labour') b='L'; else if(r.issue==='P') b=ctx.rule(r.pn,r.month,'P'); else if(r.issue==='A') b=ctx.rule(r.pn,r.month,'A'); else if(r.issue==='W') b='W'; else if(r.issue==='F') b='F'; else continue;
      var o=out[r.city]||(out[r.city]={}), m=o[r.month]||(o[r.month]={A:0,P:0,C:0,L:0,W:0,F:0,parts:{A:{},P:{},C:{}}});
      m[b]+=r.amt*w;
      if(b!=='L' && b!=='W' && b!=='F'){
        var f=ctx.fold[r.pn]||{key:r.pn,label:r.pn}, pm=m.parts[b], e=pm[f.key]||(pm[f.key]={label:f.label,amt:0,qty:0});
        e.amt+=r.amt*w; e.qty+=r.qty*w;
      }
    }
    return out;
  }
  function parseStatus(rows, header){
    var h=header.map(hdr), ci=h.indexOf('city_name'), hi=h.indexOf('hub_name'); if(ci<0) throw new Error('Could not find city_name column. Is this the bike status file?');
    var mcols=[]; h.forEach(function(x,i){ var m=x.match(/^([a-z]+)_(\d{4})_km$/); if(m){ var mi=MON.map(function(z){return z.toLowerCase();}).indexOf(m[1].slice(0,3)); if(mi>=0) mcols.push({i:i,key:mk(+m[2],mi+1)}); } });
    var km={}, fleet={}, hubFleet={}, hubKm={};
    rows.forEach(function(r){
      if(!r) return; var city=CITY[String(r[ci]==null?'':r[ci]).trim().toUpperCase()]; if(!city) return;
      var hub= hi>=0 ? String(r[hi]==null?'':r[hi]).trim() : '';
      fleet[city]=(fleet[city]||0)+1; if(hub) hubFleet[city+'|'+hub]=(hubFleet[city+'|'+hub]||0)+1;
      mcols.forEach(function(mc){ var v=+r[mc.i]||0; (km[city]=km[city]||{})[mc.key]=((km[city]||{})[mc.key]||0)+v; if(hub){ var k=city+'|'+hub+'|'+mc.key; hubKm[k]=(hubKm[k]||0)+v; } });
    });
    var latest=null; mcols.forEach(function(mc){ var t=0; Object.keys(km).forEach(function(c){ t+=(km[c][mc.key]||0); }); if(t>0 && (!latest||mc.key>latest)) latest=mc.key; });
    return {km:km, fleet:fleet, hubFleet:hubFleet, hubKm:hubKm, latest:latest};
  }
  function defaultFleet(){ return {
    BLR:{'2026-01':4030,'2026-02':4379,'2026-03':5208,'2026-04':6272,'2026-05':7149,'2026-06':8193,'2026-07':9069,'2026-08':9959,'2026-09':10173,'2026-10':10400},
    NCR:{'2026-01':1962,'2026-02':2011,'2026-03':2075,'2026-04':2084,'2026-05':2084,'2026-06':2062,'2026-07':2032,'2026-08':2134,'2026-09':2095,'2026-10':2097},
    HYD:{'2026-04':150,'2026-05':307,'2026-06':643,'2026-07':735,'2026-08':795,'2026-09':1019,'2026-10':1174}}; }
  function defaultKm(){ return {
    BLR:{'2026-01':8995829,'2026-02':9266271,'2026-03':12536399,'2026-04':13467616,'2026-05':17175812,'2026-06':19418597,'2026-07':24690036,'2026-08':25281609,'2026-09':25081674,'2026-10':6068048},
    NCR:{'2026-01':4036964,'2026-02':4175102,'2026-03':4777794,'2026-04':4711656,'2026-05':4728624,'2026-06':5224772,'2026-07':5873417,'2026-08':5822235,'2026-09':5186603,'2026-10':1175732},
    HYD:{'2026-04':248074,'2026-05':690958,'2026-06':1511151,'2026-07':1759228,'2026-08':1917248,'2026-09':2410996,'2026-10':720031}}; }
  function defaultOps(){ return {"labour": {"BLR": {"2026-02": 846023, "2026-03": 962959, "2026-04": 1313357, "2026-05": 1357595, "2026-06": 1695951, "2026-07": 2379706, "2026-08": 2414062, "2026-09": 2519000}, "NCR": {"2026-02": 498728, "2026-03": 462725, "2026-04": 487656, "2026-05": 475152, "2026-06": 573236, "2026-07": 713232, "2026-08": 642334, "2026-09": 964304}, "HYD": {"2026-04": 81105, "2026-05": 139163, "2026-06": 145897, "2026-07": 145383, "2026-08": 134991, "2026-09": 190000}}, "other": {"BLR": {"2026-02": 316602, "2026-03": 416119, "2026-04": 696819, "2026-05": 783530, "2026-06": 1534549, "2026-07": 1279636, "2026-08": 1543645, "2026-09": 948692}, "NCR": {"2026-02": 16088, "2026-03": 68475, "2026-04": 279256, "2026-05": 193812, "2026-06": 439206, "2026-07": 363728, "2026-08": 1372162, "2026-09": 181808}, "HYD": {"2026-05": 31283, "2026-06": 54526, "2026-07": 71001, "2026-08": 110823, "2026-09": 80964, "2026-04": 0}}}; }
  return {defaultOps:defaultOps, NORM:NORM, CITY:CITY, detectCols:detectCols, parseMonth:parseMonth, monthLabel:monthLabel, newStore:newStore, ingest:ingest, defaultRules:defaultRules, compileRules:compileRules, buildFold:buildFold, compute:compute, parseStatus:parseStatus, defaultFleet:defaultFleet, defaultKm:defaultKm};
})();
if (typeof module!=='undefined') module.exports = SVCCore;
</script>

<script id="ui">
(function(){
'use strict';
var C = SVCCore, root = document.getElementById('svc');

function readSess(){ try{ var ls=localStorage.getItem('sb_session'); if(ls) return {s:JSON.parse(ls),store:localStorage}; var ss=sessionStorage.getItem('sb_session'); if(ss) return {s:JSON.parse(ss),store:sessionStorage}; }catch(e){} return {s:{},store:localStorage}; }
function tokenExpMs(jwt){ try{ var p=JSON.parse(atob(jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return p.exp?p.exp*1000:null; }catch(e){ return null; } }
var _refreshing=null;
async function refreshSession(){
  if(_refreshing) return _refreshing;
  _refreshing=(async function(){
    var o=readSess(), s=o.s; if(!s.refresh_token) return null;
    try{
      var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok) return null; var d=await r.json(); if(!d.access_token) return null;
      s=Object.assign({},s,{access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token});
      o.store.setItem('sb_session',JSON.stringify(s)); return s.access_token;
    }catch(e){ return null; }
  })();
  try{ return await _refreshing; } finally { _refreshing=null; }
}
async function validToken(){
  var s=readSess().s; if(!s.access_token) return null;
  var exp=tokenExpMs(s.access_token); if(exp&&exp>Date.now()+30000) return s.access_token;
  return (await refreshSession())||s.access_token;
}
async function api(path,opts){
  opts=opts||{};
  var go=function(tok){ var h={apikey:ANON,Authorization:'Bearer '+tok,'Content-Type':'application/json'}; if(opts.range) { h['Range-Unit']='items'; h.Range=opts.range; } return fetch(SB+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined}); };
  var tok=await validToken(); if(!tok) return {ok:false,status:401,msg:'Please log in to the portal again'};
  var r=await go(tok);
  if(r.status===401){ var nt=await refreshSession(); if(nt) r=await go(nt); }
  if(r.ok){ var t=await r.text(); return {ok:true,data:t?JSON.parse(t):null}; }
  var m=''; try{ var e=await r.json(); m=e.message||''; }catch(x){}
  return {ok:false,status:r.status,msg:m||('HTTP '+r.status)};
}
async function getAll(path){
  var out=[], from=0, size=1000;
  while(true){
    var r=await api(path,{range:from+'-'+(from+size-1)});
    if(!r.ok) return r;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<size) break;
    from+=size;
  }
  return {ok:true,data:out};
}

  if(jsh) XLSX.utils.sheet_to_json(jsh,{header:1,raw:true,defval:null}).slice(1).forEach(function(r){
    if(!r) return; var c=C.CITY[String(r[0]==null?'':r[0]).trim().toUpperCase()], mm=C.parseMonth(r[1]), n=+r[2];
    if(c && mm && n>0) (jcSheet[mm]=jcSheet[mm]||[]).push({city:CITY_FULL[c],hub:'',total:null,parts:n,bikes:null});

  var V=ms.map(function(m){ return pSplitVal(city,m); }); if(!V.some(function(v){return v;})) return '';
  var lbl=function(m){ return C.monthLabel(m)+(isPartialMonth(m)?'*':''); };
  var cell=function(v,m,bold){ if(v==null) return '<td>\u2013</td>'; var x=val(v,city,m); return '<td'+(bold?' style="font-weight:700"':'')+'>'+fmt(x)+'</td>'; };
  var pct=function(a,b){ return b?Math.round(a/b*100)+'%':''; };
  var row=function(label,fn,opt){ opt=opt||{}; return '<tr'+(opt.cls?' class="'+opt.cls+'"':'')+'><td style="'+(opt.indent?'padding-left:20px;color:#475569':'')+(opt.bold?';font-weight:700':'')+'">'+label+'</td>'+
      V.map(function(v,i){ if(!v) return '<td>\u2013</td>'; var a=fn(v), t=opt.of?opt.of(v):(opt.self?a:null);
        return dispCell(val(a,city,ms[i]), t?a/t:null, opt.bold?'font-weight:700':''); }).join('')+'</tr>'; };
  var T=function(v){return v.pp+v.pl;};
  var h='<div class="card" style="margin-top:12px"><h3>'+cityName(city)+(city==='ALL'?' combined':'')+' \u00b7 P category (rider-payable) breakup</h3><p class="sub">'+unitName()+' \u00b7 parts + labour \u00b7 from job cards with P-category lines and the damage fee data</p>'
    +'<div class="row" style="margin:4px 0 8px"><span style="font-size:12px;color:#64748b;margin-right:4px">Submission type</span><span class="chip'+(!(state.psub||[]).length?' on':'')+'" data-a="psub" data-v="">All</span>'
    +(state.stTypes||[]).map(function(t){ return '<span class="chip'+((state.psub||[]).indexOf(t)>=0?' on':'')+'" data-a="psub" data-v="'+esc(t)+'">'+esc(t)+'</span>'; }).join('')+'</div><div class="tw"><table><tr><th></th>'+ms.map(function(m){return '<th>'+lbl(m)+'</th>';}).join('')+'</tr>';
  h+=row('P cost (parts + labour (as per DMS))', T, {bold:true, cls:'tot', self:1});
  h+=row('\u2705 Damage fee revenue', function(v){return v.rev_p+v.rev_l;}, {indent:1, of:T});
  h+=row('\ud83d\udcb8 Charged, not collected', function(v){return v.cnc_p+v.cnc_l;}, {indent:1, of:T});
  h+=row('\u26d4 Above \u20b93,000 cap \u00b7 rider paid in full', function(v){return v.cap_paid;}, {indent:1, of:T});
  h+=row('\u26d4 Above \u20b93,000 cap \u00b7 rider not paid in full', function(v){return v.cap_unpaid;}, {indent:1, of:T});
  h+=row('\u26a0\ufe0f Not charged to rider (visible damage missed at inspection)', function(v){return v.nc_p+v.nc_l;}, {indent:1, of:T});
  h+=row('\ud83d\udc41\ufe0f Non-visible components', function(v){return v.hid;}, {indent:1, of:T});
  h+='<tr><td colspan="'+(ms.length+1)+'" style="padding:0;border-top:2px solid #cbd5e1"></td></tr>';
  h+=row('<span style="color:#64748b">\u2795 Extra fee collected <i>(not part of P cost)</i></span>', function(v){return v.extra;}, {of:T});
  h+='<tr><td style="color:#6b7280">Job cards with P-category lines</td>'+V.map(function(v){return '<td style="color:#6b7280">'+(v?v.jcs.toLocaleString('en-IN'):'\u2013')+'</td>';}).join('')+'</tr>';
  h+='</table></div><p class="sub">Per job card: <b>non-visible</b> = hidden parts behind panels (harnesses, IoT device, power connector, DC-DC converter) and their labour; the rest is visible cost, capped at \u20b93,000. <b>Revenue</b> = fee collected and <b>charged, not collected</b> = fee raised but not collected, both counted only up to the capped visible cost. <b>Above \u20b93,000 cap</b> = visible damage cost beyond the \u20b93,000 the rider can be charged: <b>rider paid in full</b> when the rider paid the whole \u20b93,000, <b>rider not paid in full</b> when they paid less or nothing. <b>Not charged to rider</b> = damage that was visible at inspection, within the cap, but was not charged to the rider. The six buckets add up to the P cost (parts + labour (as per DMS)). Fee collected above the repair cost (flat fees, penalties) is shown separately as <b>extra fee</b>. These P figures come from job cards, so they can differ slightly from the DMS-based P row above.</p></div>';
  return h;
}

function partRows(model, city, bucket, months){
  var map={}; months.forEach(function(m){ var d=model[city]&&model[city][m]; if(!d) return; Object.keys(d.parts[bucket]).forEach(function(k){ var e=d.parts[bucket][k]; (map[k]=map[k]||{label:e.label,by:{}}).by[m]=e; }); });
  return Object.keys(map).map(function(k){ return {key:k,label:map[k].label,by:map[k].by}; });
}

function viewMovers(model){

   +'<select data-a="mb">'+['A','P','C'].map(function(b){return '<option value="'+b+'"'+(M.bucket===b?' selected':'')+'>'+NAMES[b]+'</option>';}).join('')+'</select>'
   +'<select data-a="mx">'+ms.map(function(m){return '<option value="'+m+'"'+(M.x===m?' selected':'')+'>'+C.monthLabel(m)+'</option>';}).join('')+'</select><span>to</span>'
   +'<select data-a="my">'+ms.map(function(m){return '<option value="'+m+'"'+(M.y===m?' selected':'')+'>'+C.monthLabel(m)+'</option>';}).join('')+'</select></div>';
  if(!bx||!by) return h+'<div class="empty">Pick two months that have data for '+cityName(city)+' (the month filter must include both).</div></div>';
  var map={}; Object.keys(bx.parts[M.bucket]).forEach(function(k){ map[k]={label:bx.parts[M.bucket][k].label,x:bx.parts[M.bucket][k],y:{amt:0,qty:0}}; });
  Object.keys(by.parts[M.bucket]).forEach(function(k){ (map[k]=map[k]||{label:by.parts[M.bucket][k].label,x:{amt:0,qty:0}}).y=by.parts[M.bucket][k]; });
  var rows=Object.keys(map).map(function(k){ var r=map[k]; r.d=(val(r.y.amt,city,M.y)||0)-(val(r.x.amt,city,M.x)||0); return r; }).sort(function(a,b){return b.d-a.d;});

  function tbl(list,title){ var s='<div class="tw"><table><tr><th>'+title+'</th><th>Change</th><th>'+C.monthLabel(M.x)+' units</th><th>'+C.monthLabel(M.x)+' \u20b9</th><th>'+C.monthLabel(M.y)+' units</th><th>'+C.monthLabel(M.y)+' \u20b9</th><th>\u20b9/unit</th></tr>';
    list.forEach(function(r){ var u=r.y.qty?r.y.amt/r.y.qty:(r.x.qty?r.x.amt/r.x.qty:0); s+='<tr><td>'+esc(r.label)+'</td><td class="'+(r.d>0?'up':'dn')+'">'+(r.d>0?'+':'')+fmt(r.d)+'</td><td>'+Math.round(r.x.qty).toLocaleString('en-IN')+'</td><td>'+Math.round(r.x.amt).toLocaleString('en-IN')+'</td><td>'+Math.round(r.y.qty).toLocaleString('en-IN')+'</td><td>'+Math.round(r.y.amt).toLocaleString('en-IN')+'</td><td>'+Math.round(u).toLocaleString('en-IN')+'</td></tr>'; });
    return s+'</table></div>'; }
  return h+'<div class="grid2"><div><b>Top 10 increases</b>'+tbl(rows.filter(function(r){return r.d>0;}).slice(0,10),'Part')+'</div><div><b>Top 10 decreases</b>'+tbl(rows.filter(function(r){return r.d<0;}).reverse().slice(0,10),'Part')+'</div></div></div>';

function viewHubs(model){

    var b= (r.issue==='P'||r.issue==='A')?ctxo.rule(r.pn,r.month,r.issue):null; if(!b) return; var hk=r.city+'|'+r.hub; (by[hk]=by[hk]||{A:0,P:0,C:0})[b]+=r.amt*((state.F.dyear&&state.cohort)?cohortShare(r):1); });
  var rows=Object.keys(by).map(function(k){ var t=by[k].A+by[k].P+by[k].C, f=state.hubFleet[k], kp=k.split('|'); return {hub:(city==='ALL'?kp[0]+' \u00b7 ':'')+kp.slice(1).join('|'),A:by[k].A,P:by[k].P,C:by[k].C,t:t,f:f,pb:f?t/(f*months.length):null}; }).sort(function(a,b){return b.t-a.t;});
  var h='<div class="card"><h3>Hubs</h3><div class="row"><select data-a="hcity">'+cityOpts(city)+'</select></div><p class="sub">Parts cost by hub for '+months.map(C.monthLabel).join(', ')+'. Per bike per month uses the hub\'s current fleet from the fleet/km file.</p>';

  var pbs=rows.map(function(r){return r.pb;}).filter(function(v){return v!=null;}), mn=Math.min.apply(null,pbs), mx=Math.max.apply(null,pbs);

function viewDist(){
  var D=state.dist, yrs=[...new Set((state.store.dist||[]).map(function(r){return r.yr;}).filter(function(y){return y!=='all';}))].sort();
  if(!D.yr || (D.yr!=='all' && yrs.indexOf(D.yr)<0)) D.yr='all';
  var dl=(state.store.dist||[]).filter(function(r){ return r.yr===D.yr; });
  var h='<div class="card"><h3>Distance between replacements</h3><div class="row">'
    +[['med','Median'],['avg','Average'],['both','Average / Median']].map(function(o){ return '<span class="chip'+(D.stat===o[0]?' on':'')+'" data-a="dstat" data-v="'+o[0]+'">'+o[1]+'</span>'; }).join('')
    +'<span style="width:14px"></span><label style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em">Deployed year</label>'
    +[['all','All bikes']].concat(yrs.map(function(y){return [y, y==='unknown'?'Unknown':y];})).map(function(o){ return '<span class="chip'+(D.yr===o[0]?' on':'')+'" data-a="dyear" data-v="'+o[0]+'">'+o[1]+'</span>'; }).join('')+'</div>'
    +'<p class="sub">Km between consecutive replacements of the same part on the same bike, by month of the later replacement, the same as Wear &amp; Tear consumption (Other replacements): first fitments, 0 km gaps and flagged odometer readings are left out; Front Tyre 12-Inch and Zoom count as one front-tyre position. Deployed year = the bike\'s first deployment year. * = fewer than 5 replacements (indicative only). Hover a cell for the count. Higher km is green, lower is red.</p></div>';
  if(!dl.length) return h+'<div class="empty">No distance data yet. Import the service-cost file that has the "Replacement distance" sheet.</div>';
  var months=selMonths(), fmtK=function(v){ return Math.round(v).toLocaleString('en-IN'); };
  state.F.cities.forEach(function(city){
    var rows=dl.filter(function(r){ return r.city===city && months.indexOf(r.month)>=0; }); if(!rows.length) return;
    var ms=months.filter(function(m){ return rows.some(function(r){return r.month===m;}); }), parts=[];
    rows.forEach(function(r){ if(parts.indexOf(r.part)<0) parts.push(r.part); });
    h+='<div class="card"><h3>'+city+' \u00b7 '+(D.stat==='med'?'Median km':D.stat==='avg'?'Average km':'Average / Median km')+'</h3><div class="tw"><table><tr><th>Part</th>'+ms.map(function(m){return '<th>'+C.monthLabel(m)+'</th>';}).join('')+'</tr>';
    parts.forEach(function(p){
      var cells=ms.map(function(m){ return rows.filter(function(r){return r.part===p&&r.month===m;})[0]||null; });
      var key=D.stat==='avg'?'avg':'med', vals=cells.map(function(c){return c?c[key]:null;}), nums=vals.filter(function(v){return v!=null;}), mn=Math.min.apply(null,nums), mx=Math.max.apply(null,nums);
      h+='<tr><td>'+esc(p)+'</td>'+cells.map(function(c,i){
        if(!c) return '<td style="color:#999">\u2014</td>';
        var star=c.n<5?'*':'', txt=D.stat==='both' ? fmtK(c.avg)+' / '+fmtK(c.med)+star : fmtK(c[key])+star;
        return '<td title="'+c.n+' replacements \u00b7 avg '+fmtK(c.avg)+' \u00b7 median '+fmtK(c.med)+'" style="'+heat(mn+mx-vals[i],mn,mx)+'">'+txt+'</td>'; }).join('')+'</tr>';
    });
    h+='</table></div></div>';
  });
  return h;
}
function viewSettings(){
  var ms=allMonths(), cs=allCities(), h='<div class="card"><h3>Reclassification rules</h3><p class="sub">A rule moves a part\'s A-tagged amount to P or C. P-tagged amounts stay in P unless the rule is marked <b>A + P</b> (e.g. frames). Saved for everyone using this dashboard. "From" limits it to that month onwards (use it for September-only changes). End a name with * to match all variants starting with it. Changes apply immediately.</p>'
   +'<div class="row"><label><input type="checkbox" data-a="fold"'+(state.foldOn?' checked':'')+'> Fold refurbished variants into their base part in part tables</label></div><div class="tw"><table><tr><th>Part name (as in DMS)</th><th>Move to</th><th>Moves</th><th>From month</th><th></th></tr>';
  state.rules.forEach(function(r,i){ h+='<tr><td>'+esc(r.name)+'</td><td><b style="color:'+COLORS[r.to]+'">'+r.to+'</b></td><td>'+(r.p?'<b>A + P</b>':'A only')+'</td><td>'+(r.from?C.monthLabel(r.from):'all months')+'</td><td><span class="x" data-a="rdel" data-v="'+i+'" title="Remove">'+ic('trash')+'</span></td></tr>'; });
  h+='</table></div><div class="row" style="margin-top:10px"><input type="text" id="rn" placeholder="Part name, e.g. DIU UNIT or MASTER CYLINDER HANDLE*" style="min-width:320px"><select id="rt"><option>C</option><option>P</option></select><input type="month" id="rf"><label style="display:flex;align-items:center;gap:4px;font-size:12px"><input type="checkbox" id="rp"> also P-tagged</label><button class="btn sm pri" data-a="radd">Add rule</button><button class="btn sm" data-a="rreset">Reset to defaults</button></div></div>';
  h+='<div class="card"><h3>Monthly inputs (₹ lakh, per city)</h3><p class="sub"><b>Labour (as per payroll)</b> and <b>Other maintenance</b> feed the Total. COCO, Porter, Insurance &amp; IOT, Warranty provision, Insurance claim, Scrap, Warranty claim and AD recovery are kept for reference. Changes save as you leave each box.</p><div class="row"><select data-a="opscity">'+CITIES.filter(function(c){return state.store.rows.some(function(r){return r.city===c;});}).map(function(c){return '<option value="'+c+'"'+(state.opsCity===c?' selected':'')+'>'+CITY_FULL[c]+'</option>';}).join('')+'</select></div>';
  var oc=state.opsCity||'BLR', oms=ms.filter(function(m){ return !/p$/.test(m); });   // the same-days column (e.g. Sep 1-20) is calculated, not entered var nm=new Date(); var cur=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0'); if(oms.indexOf(cur)<0) oms.push(cur);
  h+='<div class="tw"><table><tr><th>Input</th>'+oms.map(function(m){return '<th>'+C.monthLabel(m)+'</th>';}).join('')+'</tr>';
  OPS_IN.forEach(function(f){ h+='<tr><td'+(f[0]==='labour'||f[0]==='other'?' style="font-weight:700"':'')+'>'+f[1]+'</td>'+oms.map(function(m){ var o=(state.ops[oc]||{})[m]||{}, v=o[f[0]]; return '<td><input type="number" step="0.01" style="width:78px" data-a="opsin" data-k="'+f[0]+'" data-c="'+oc+'" data-m="'+m+'" value="'+(v==null?'':Math.round(v/1000)/100)+'"></td>'; }).join('')+'</tr>'; });
  h+='</table></div></div>';
  h+='<div class="card"><h3>Fleet and km (denominators for per-bike and per-km)</h3><p class="sub">Fleet = monthly average of daily active bikes; km = sum of each bike\'s monthly km (Metabase exports).</p><div class="tw"><table><tr><th>City / metric</th>'+ms.map(function(m){return '<th>'+C.monthLabel(m)+'</th>';}).join('')+'</tr>';
  cs.forEach(function(c){ [['fleet','Fleet (avg active bikes)'],['km','Km run']].forEach(function(t2){ h+='<tr><td>'+c+' \u00b7 '+t2[1]+'</td>'+ms.map(function(m){ var v=(state[t2[0]][c]||{})[m]; return '<td>'+(v==null?'\u2013':Math.round(v).toLocaleString('en-IN'))+'</td>'; }).join('')+'</tr>'; }); });
  h+='</table></div></div><div class="card"><h3>Data</h3><p class="sub">DMS billing lines in the portal, by month. Uploading an RMC file replaces the months it covers.</p>'
   +state.store.files.map(function(f){ return '<div>'+esc(f.name)+' <span class="pill">'+f.months.map(C.monthLabel).join(', ')+'</span> '+f.rows.toLocaleString('en-IN')+' grouped lines</div>'; }).join('')
   +'<div class="row" style="margin-top:10px"><button class="btn sm pri" data-a="pickjc">'+ic('upload')+' Upload RMC month (DMS export)</button></div></div>';
  return h;
}
function viewEmpty(){ return '<div class="empty">'+(state.loading?'Loading RMC data…':esc(state.msg||'No data'))+'</div>'; }
function render(){
  if(state.tab==='hubs') state.tab='overview';
  state.F.shareFn=shareFnNow(); var has=state.store.rows.length>0, model=has?addAll(C.compute(state.store,ctx(),state.F)):{}, tabs=[['overview','Overview','chart'],['parts','Part breakup','table'],['movers','Movers','sort'],['dist','Replacement km','sort'],['settings','Rules & settings','adjust']];
  var body=!has && state.tab!=='settings' ? viewEmpty() : state.tab==='overview'?viewOverview(model):state.tab==='parts'?viewParts(model):state.tab==='movers'?viewMovers(model):state.tab==='hubs'?viewHubs(model):state.tab==='dist'?viewDist():viewSettings();
  root.innerHTML='<div class="hd"><div><h1>RMC Dashboard</h1><p>Wear &amp; Tear (A), Rider-payable (P), Cost to company (C) from the DMS billing export · Net service cost with monthly inputs</p></div><div class="grp"><span class="status" id="svc-status">'+esc(state.msg)+'</span>'
    +'<button class="btn ghost" data-a="reload">'+ic('sort')+' Refresh</button></div></div>'
    +(has?filterBar():'')+'<div class="tabs">'+tabs.map(function(t){return '<div class="tab'+(state.tab===t[0]?' on':'')+'" data-a="tab" data-v="'+t[0]+'">'+ic(t[2])+t[1]+'</div>';}).join('')+'</div><div class="main">'+body+'</div>'
    +'<input type="file" id="f_jc" accept=".xlsx,.xls,.csv" style="display:none"><input type="file" id="f_st" accept=".xlsx,.xls,.csv" style="display:none">';
}
function toggle(arr,v){ var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }
function csv(){
  state.F.shareFn=shareFnNow(); var model=addAll(C.compute(state.store,ctx(),state.F)), P=state.parts, ms=selMonths().filter(function(m){return model[P.city]&&model[P.city][m];}), rows=partRows(model,P.city,P.bucket,ms), last=ms[ms.length-1];
  rows.sort(function(a,b){return ((b.by[last]||{amt:0}).amt)-((a.by[last]||{amt:0}).amt);});
  var out=['Part,'+ms.map(C.monthLabel).join(',')]; rows.forEach(function(r){ out.push('"'+r.label.replace(/"/g,'""')+'",'+ms.map(function(m){var v=val(r.by[m]?r.by[m].amt:0,P.city,m);return v==null?'':v;}).join(',')); });
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/csv'})); a.download='parts_'+P.city+'_'+P.bucket+'_'+state.unit+'.csv'; a.click();
}
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return; var a=el.getAttribute('data-a'), v=el.getAttribute('data-v');
  if(a==='tab') state.tab=v;
  else if(a==='city'){ var ac=allCities();
    if(v==='ALL') state.F.cities=ac.slice();
    else if(state.F.cities.length===ac.length) state.F.cities=[v];
    else { toggle(state.F.cities,v); if(!state.F.cities.length) state.F.cities=ac.slice(); }
    state.F.cities=ac.filter(function(c){ return state.F.cities.indexOf(c)>=0; });
    state.parts.city=state.mv.city=state.hubs.city=defCity(); state.F.hub=''; state.F.hubs=[]; }
  else if(a==='month'){ var all=allMonths(); if(!state.F.months.length) state.F.months=all.slice(); toggle(state.F.months,v); if(!state.F.months.length||state.F.months.length===all.length) state.F.months=[]; }
  else if(a==='unit'){ state.unit=v; if(state.disp==='pct') state.disp=state.withPct?'both':'val'; }
  else if(a==='psub'){ if(!v) state.psub=[]; else toggle(state.psub, v); }
  else if(a==='disp') state.disp=v;
  else if(a==='pb') state.parts.bucket=v;
  else if(a==='pmeas') state.parts.measure=v;
  else if(a==='dstat') state.dist.stat=v;
  else if(a==='dyear') state.dist.yr=v;
  else if(a==='psort'){ var P2=state.parts; if((P2.sortKey||'')===v) P2.sortDir=(P2.sortDir==='asc'?'desc':'asc'); else { P2.sortKey=v; P2.sortDir=(v==='name'?'asc':'desc'); } }
  else if(a==='pickjc'){ document.getElementById('f_jc').click(); return; }
  else if(a==='reload'){ loadAll(); return; }
  else if(a==='csv'){ csv(); return; }
  else if(a==='rdel'){ state.rules.splice(+v,1); saveRules(); }
  else if(a==='radd'){ var n=document.getElementById('rn').value.trim(); if(!n) return; state.rules.push({name:n,to:document.getElementById('rt').value,from:document.getElementById('rf').value||'',p:document.getElementById('rp').checked}); saveRules(); }
  else if(a==='rreset'){ if(!confirm('Reset the rules to the original 26?')) return; state.rules=C.defaultRules(); saveRules(); }
  
  else return;
  render();
});
root.addEventListener('toggle',function(e){ if(e.target && e.target.classList && e.target.classList.contains('hubdd')) state.hubOpen=e.target.open; }, true);
document.addEventListener('click',function(e){ if(state.hubOpen && !(e.target.closest && e.target.closest('.hubdd'))){ state.hubOpen=false; var d=document.querySelector('.hubdd'); if(d) d.open=false; } });
root.addEventListener('change',function(e){
  var el=e.target, a=el.getAttribute('data-a');
  if(el.id==='f_jc'){ var fl=el.files[0]; if(fl){ toast('Reading '+fl.name+' …'); var fr=new FileReader(); fr.onload=function(){ setTimeout(function(){ uploadDMS(fr.result, fl.name).catch(function(err){ toast('Error: '+err.message); }); },30); }; fr.readAsArrayBuffer(fl); } el.value=''; return; }
  if(a==='opscity'){ state.opsCity=el.value; render(); return; }
  if(a==='opsin'){ var k=el.getAttribute('data-k'), c=el.getAttribute('data-c'), m=el.getAttribute('data-m'), rupees=el.value===''?null:Math.round(parseFloat(el.value)*100000); var o=((state.ops[c]=state.ops[c]||{})[m]=(state.ops[c]||{})[m]||{month:m,city:CITY_FULL[c]}); o[k]=rupees; var vv={}; vv[k]=rupees==null?'':rupees; rpc('rmc_save_ops',{p_month:m,p_city:CITY_FULL[c],p_vals:vv}).then(function(r){ toast(r.ok?'Saved '+k.replace('_',' ')+' · '+CITY_FULL[c]+' '+C.monthLabel(m):'Could not save: '+r.msg); }); return; }
  if(!a) return;
  if(a==='fdyear'){ state.F.dyear=el.value; if(el.value && !state.cohort){ loadCohort(); } }
  else if(a==='withpct'){ state.withPct=el.checked; if(state.disp!=='pct') state.disp=el.checked?'both':'val'; }
  else if(a==='stchk'){ if(el.value==='__all') state.stSel=[]; else toggle(state.stSel, el.value); state.F.st=state.stSel.join(', '); state.hubOpen=true; if(state.stSel.length && !state.subtype){ loadSubtype(); } }
  else if(a==='model') state.F.model=el.value;
  else if(a==='pcity') state.parts.city=el.value; else if(a==='ptop') state.parts.top=+el.value;
  else if(a==='mcity') state.mv.city=el.value; else if(a==='mb') state.mv.bucket=el.value; else if(a==='mx') state.mv.x=el.value; else if(a==='my') state.mv.y=el.value;
  else if(a==='hcity') state.hubs.city=el.value;
  else if(a==='fold') state.foldOn=el.checked;
  
  render();
});
root.addEventListener('input',function(e){ var el=e.target; if(el.getAttribute&&el.getAttribute('data-a')==='pq'){ state.parts.q=el.value; var pos=el.selectionStart; render(); var n=root.querySelector('[data-a=pq]'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } } });


window.SVC_APP={state:state,importJC:importJC,importStatus:importStatus,render:render};
state.opsCity='BLR';
render();
loadAll();
})();
</script>
