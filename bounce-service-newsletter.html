<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under the Hood · Service Newsletter · Bounce Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111113;--bg-2:#161619;--surf:#1c1c21;--surf-2:#232329;
    --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
    --text:#F2F2F4;--mut:#9a9aa6;
    --red:#f53b3b;--red-lt:#ff6b6b;--red-deep:#d92d2d;
    --green:#56d364;--amber:#F6A623;--indigo:#282848;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,'Segoe UI',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:820px;margin:0 auto;position:relative}
  a{color:inherit;text-decoration:none}

  #progress{position:fixed;top:0;left:0;height:3px;width:0%;z-index:60;background:linear-gradient(90deg,var(--red),var(--red-lt));box-shadow:0 0 12px rgba(245,59,59,.6)}

  .rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  .rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
  body.editing .rv{opacity:1;transform:none;transition:none}
  body.editing .bar-fill{transition:none}
  .lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600}

  .hero{position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:44px 52px 84px;overflow:hidden;background:var(--bg)}
  .aurora{position:absolute;inset:-20%;z-index:0;filter:blur(72px);opacity:.5}
  .blob{position:absolute;border-radius:50%}
  .b1{width:520px;height:520px;background:radial-gradient(circle,#f53b3b66,transparent 70%);top:-60px;left:-40px;animation:drift1 16s ease-in-out infinite}
  .b2{width:460px;height:460px;background:radial-gradient(circle,#ff7a3b4d,transparent 70%);top:120px;right:-80px;animation:drift2 20s ease-in-out infinite}
  .b3{width:440px;height:440px;background:radial-gradient(circle,#28284855,transparent 70%);bottom:-80px;left:28%;animation:drift3 22s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(60px,50px) scale(1.1)}}
  @keyframes drift2{50%{transform:translate(-50px,60px) scale(1.08)}}
  @keyframes drift3{50%{transform:translate(40px,-40px) scale(1.12)}}
  .hero-grid{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000,transparent);mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000,transparent)}
  .hero-inner{position:relative;z-index:3;width:100%}

  .masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line-2);margin-bottom:34px}
  .masthead img{height:40px;width:auto}
  .masthead .issue{text-align:right;line-height:1.4}
  .masthead .issue .t{color:var(--red-lt)}
  .masthead .issue .d{color:var(--mut);font-size:12px;font-weight:500}

  .kicker{color:var(--red-lt)}
  .hero h1{font-weight:800;font-size:clamp(52px,11vw,96px);line-height:.9;letter-spacing:-.04em;margin:14px 0 0}
  .hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--red-lt),var(--red) 55%,var(--red-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:var(--mut);font-size:16px;margin-top:14px;max-width:520px}

  .editor-note{margin-top:36px;padding:24px 26px;background:linear-gradient(180deg,var(--surf),var(--bg-2));border:1px solid var(--line);border-left:3px solid var(--red);border-radius:14px;max-width:600px}
  .editor-note .e-head{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--red-lt);margin-bottom:10px}
  .editor-note p{font-size:15px;color:#d4d4dc}
  .editor-note b{color:#fff}

  .contents{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px}
  .contents a{font-size:12.5px;font-weight:500;color:var(--mut);border:1px solid var(--line-2);border-radius:100px;padding:7px 15px;transition:.25s}
  .contents a:hover{color:#fff;border-color:var(--red);background:rgba(245,59,59,.1)}
  .contents a b{color:var(--red-lt);font-weight:700;margin-right:6px}

  .scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:9px;animation:bob 2.2s ease-in-out infinite}
  .scroll-cue .ln{width:1px;height:30px;background:linear-gradient(var(--red),transparent)}
  @keyframes bob{50%{transform:translate(-50%,8px)}}

  .act{padding:88px 52px;position:relative}
  .act-label{color:var(--mut);display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .act-label b{color:var(--red);font-weight:700}
  .act h2{font-weight:700;font-size:clamp(26px,4vw,34px);letter-spacing:-.02em;line-height:1.12;margin-bottom:8px}
  .act .lede{color:var(--mut);font-size:15px;max-width:560px;margin-bottom:38px}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .kcard{background:linear-gradient(180deg,var(--surf),var(--bg-2));border:1px solid var(--line);border-radius:16px;padding:26px 24px;position:relative;overflow:hidden}
  .kcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--red-lt));opacity:.8}
  .kcard .kl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--mut)}
  .kcard .kv{font-weight:800;font-size:40px;letter-spacing:-.03em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
  .kcard .kd{font-size:12.5px;font-weight:600;color:var(--green)}
  .kcard .kd.warn{color:var(--amber)}

  .bars{margin-top:8px}
  .bar-row{margin:22px 0}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .bar-top .bn{font-weight:600;font-size:15px}
  .bar-top .bv{font-size:13px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums}
  .bar-track{height:12px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:100px;transition:width 1.3s cubic-bezier(.2,.75,.2,1)}
  .bars.in .bar-fill{width:var(--w)}
  .bar-fill.blr{background:linear-gradient(90deg,#f53b3b,#ff6b6b)}
  .bar-fill.ncr{background:linear-gradient(90deg,#3fae4f,#56d364)}
  .bar-fill.hyd{background:linear-gradient(90deg,#F6A623,#f97316)}
  .bar-fill.alt{background:linear-gradient(90deg,#6d6df0,#9a9af7)}
  .note{color:var(--mut);font-size:13px;margin-top:22px;padding-left:16px;border-left:2px solid var(--red);font-style:italic}

  .save-total{display:flex;align-items:baseline;gap:14px;margin-bottom:34px;flex-wrap:wrap}
  .save-total .st-num{font-weight:800;font-size:clamp(48px,9vw,70px);letter-spacing:-.035em;font-variant-numeric:tabular-nums;background:linear-gradient(100deg,var(--green),#8fe89a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .save-total .st-lbl{color:var(--mut);font-size:14px;max-width:210px}
  .save-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .scard{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px}
  .scard .sv{font-weight:800;font-size:28px;color:var(--green);font-variant-numeric:tabular-nums}
  .scard .sn{font-weight:600;font-size:15px;margin-top:6px}
  .scard .sd{color:var(--mut);font-size:13px;margin-top:6px}

  .tl{position:relative;padding-left:28px}
  .tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--red),var(--red-deep),transparent)}
  .tl-item{position:relative;padding:0 0 26px}
  .tl-item::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(245,59,59,.18)}
  .tl-item h3{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tl-item p{color:var(--mut);font-size:14px;margin-top:4px}
  .tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(245,59,59,.14);color:var(--red-lt);border:1px solid rgba(245,59,59,.28)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cc{border-radius:18px;padding:26px;border:1px solid var(--line)}
  .cc.well{background:linear-gradient(180deg,rgba(86,211,100,.08),transparent)}
  .cc.miss{background:linear-gradient(180deg,rgba(246,166,35,.08),transparent)}
  .cc h3{font-size:13px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.1em}
  .cc.well h3{color:var(--green)}.cc.miss h3{color:var(--amber)}
  .dot{width:8px;height:8px;border-radius:50%}
  .cc.well .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
  .cc.miss .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .cc ul{list-style:none}
  .cc li{font-size:13.5px;padding:11px 0;border-top:1px solid var(--line);color:var(--mut)}
  .cc li:first-child{border-top:none}
  .cc li b{color:var(--text);font-weight:600}

  .ahead{background:linear-gradient(135deg,var(--surf-2),var(--bg-2));border:1px solid var(--line-2);border-radius:22px;padding:40px}
  .ahead .a-eye{color:var(--red-lt)}
  .ahead h2{font-weight:700;font-size:28px;margin:8px 0 22px;letter-spacing:-.02em}
  .ahead ul{list-style:none}
  .ahead li{font-size:14.5px;padding:15px 0;border-top:1px solid var(--line);display:flex;gap:16px;color:var(--mut)}
  .ahead li:first-child{border-top:none}
  .ahead li .ar{color:var(--red);font-weight:700}
  .ahead li b{color:var(--text);font-weight:600}

  .foot{padding:60px 52px 86px;text-align:center;border-top:1px solid var(--line)}
  .foot-logo{height:52px;width:auto;margin:0 auto 20px;display:block}
  .foot .sig{color:var(--text);font-weight:600;font-size:15px}
  .foot .sub{color:var(--mut);font-size:13px;margin-top:3px}
  .foot .mk{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--mut);margin-top:24px}

  /* ============ EDIT MODE UI ============ */
  #toolbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:80;display:none;align-items:center;justify-content:space-between;
    padding:0 18px;background:rgba(15,15,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
  body.editing #toolbar{display:flex}
  #toolbar .tb-l{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
  #toolbar .badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
  #toolbar .tb-r{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:var(--surf-2);border:1px solid var(--line-2);
    border-radius:8px;padding:8px 13px;cursor:pointer;transition:.2s}
  .tbtn:hover{border-color:var(--red);background:rgba(245,59,59,.12)}
  .tbtn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .tbtn.primary:hover{background:var(--red-deep)}

  #editor{position:fixed;top:52px;right:0;bottom:0;width:390px;max-width:92vw;z-index:70;display:none;flex-direction:column;
    background:#0c0c0f;border-left:1px solid var(--line-2);overflow-y:auto}
  body.editing #editor{display:flex}
  body.editing #view{margin-right:390px}
  @media (max-width:820px){ body.editing #view{margin-right:0;filter:blur(2px);pointer-events:none} #editor{width:92vw} }
  .ed-in{padding:18px 18px 60px}
  .eg{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .eg > summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:700;font-size:13px;letter-spacing:.02em;
    background:var(--surf);display:flex;justify-content:space-between;align-items:center}
  .eg > summary::-webkit-details-marker{display:none}
  .eg > summary::after{content:"+";color:var(--red-lt);font-weight:700}
  .eg[open] > summary::after{content:"–"}
  .eg-body{padding:14px 15px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;font-family:inherit;font-size:13.5px;color:var(--text);background:#141418;
    border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--red)}
  .fld textarea{min-height:70px;line-height:1.5}
  .frow{display:flex;gap:8px}
  .frow .fld{flex:1}
  .item{border:1px dashed var(--line-2);border-radius:10px;padding:12px;margin-bottom:10px;position:relative;background:rgba(255,255,255,.015)}
  .item .rm{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;color:var(--red-lt);background:none;border:none;cursor:pointer}
  .item .rm:hover{text-decoration:underline}
  .additem{width:100%;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--red-lt);background:rgba(245,59,59,.08);
    border:1px dashed var(--red);border-radius:8px;padding:9px;cursor:pointer;margin-top:2px}
  .additem:hover{background:rgba(245,59,59,.16)}
  .hint{font-size:11px;color:var(--mut);margin:-6px 0 12px;line-height:1.4}
  #editPrompt{position:fixed;bottom:20px;right:20px;z-index:50;background:var(--red);color:#fff;font-weight:700;font-size:13px;
    border:none;border-radius:100px;padding:12px 20px;cursor:pointer;box-shadow:0 8px 24px rgba(245,59,59,.4)}

  @media (max-width:640px){
    .hero{padding:36px 24px 76px}
    .act,.foot{padding:60px 24px}
    .kpi-row,.save-grid,.two{grid-template-columns:1fr}
    .ahead{padding:28px 22px}
    .masthead img{height:32px}
  }
  @media (prefers-reduced-motion:reduce){
    .blob,.scroll-cue{animation:none}
    .rv{transition:none;opacity:1;transform:none}
    .bar-fill{transition:none;width:var(--w)}
  }
</style>
</head>
<body>
<div id="progress"></div>

<div id="toolbar">
  <div class="tb-l"><span class="badge">Editing</span><span id="tbTitle">Newsletter</span></div>
  <div class="tb-r">
    <button class="tbtn" id="btnImport">Import</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">
    <button class="tbtn" id="btnJson">Export JSON</button>
    <button class="tbtn" id="btnReset">Reset</button>
    <button class="tbtn" id="btnDone">Done</button>
    <button class="tbtn primary" id="btnExport">Export HTML</button>
  </div>
</div>

<div id="view"></div>
<div id="editor"><div class="ed-in" id="edIn"></div></div>
<button id="editPrompt" style="display:none">✎ Edit</button>

const numAttr = o => `data-count data-target="${o.value}" data-dec="${o.dec||0}" data-prefix="${o.prefix||''}" data-suffix="${o.suffix||''}"`;
const startVal = o => `${o.prefix||''}0${o.suffix||''}`;
const contentsMap = [["s1","At a glance"],["s2","Cost by city"],["s3","Savings"],["s4","Initiatives"],["s5","Wins &amp; misses"],["s6","What's next"]];

function nextMonth(m){
  const mo=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const p=(m||"").split(" "); const i=mo.indexOf(p[0]);
  if(i<0) return "Next month";
  return i===11 ? mo[0]+" "+(parseInt(p[1])+1) : mo[i+1]+" "+(p[1]||"");
}

/* ---------- ANIMATION ---------- */
let progressBound=false;
function animate(){
  const prog=document.getElementById('progress');
  if(!progressBound){ progressBound=true;
    document.addEventListener('scroll',()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';},{passive:true}); }
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const fmt=(v,dec,pre,suf)=>pre+(+v).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
  const setFinal=c=>c.textContent=fmt(c.dataset.target,+(c.dataset.dec||0),c.dataset.prefix||'',c.dataset.suffix||'');
  if(document.body.classList.contains('editing')){
    document.querySelectorAll('#view .rv').forEach(e=>e.classList.add('in'));
    document.querySelectorAll('#view .bars').forEach(e=>e.classList.add('in'));
    document.querySelectorAll('#view [data-count]').forEach(setFinal);
    return;
  }
  function countUp(el){const t=+el.dataset.target,dec=+(el.dataset.dec||0),pre=el.dataset.prefix||'',suf=el.dataset.suffix||'',dur=1300,s=performance.now();
    (function tick(now){let p=Math.min((now-s)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmt(t*e,dec,pre,suf);p<1?requestAnimationFrame(tick):setFinal(el);})(performance.now());}
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');
    en.target.querySelectorAll('[data-count]').forEach(c=>{if(c.dataset.done)return;c.dataset.done=1;reduce?setFinal(c):countUp(c);});io.unobserve(en.target);}}),{threshold:.25});
  document.querySelectorAll('#view .rv,#view [data-count]').forEach(el=>io.observe(el));
}

/* ---------- EDIT MODE ---------- */
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); }catch(e){} }
function live(){ render(); saveDraft(); }   // text edits: re-render preview only

// small DOM helpers
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
function field(label,val,on,{area=false,type="text",hint=""}={}){
  const w=el("div","fld"); w.appendChild(el("label",null,label));
  const i=document.createElement(area?"textarea":"input");
  if(!area)i.type=type; i.value=val==null?"":val;
  i.addEventListener("input",()=>on(area?i.value:(type==="number"?(i.value===""?"":parseFloat(i.value)):i.value)));
  w.appendChild(i);
  if(hint){const h=el("div","hint",hint);w.appendChild(h);}
  return w;
}
function frow(...flds){const r=el("div","frow");flds.forEach(f=>r.appendChild(f));return r;}
function selectField(label,val,opts,on){
  const w=el("div","fld");w.appendChild(el("label",null,label));
  const s=document.createElement("select");
  opts.forEach(o=>{const op=el("option",null,o);op.value=o;if(o===val)op.selected=true;s.appendChild(op);});
  s.addEventListener("change",()=>on(s.value));w.appendChild(s);return w;
}
function group(title,openFirst){const d=document.createElement("details");d.className="eg";if(openFirst)d.open=true;
  const s=document.createElement("summary");s.innerHTML=title;d.appendChild(s);
  const b=el("div","eg-body");d.appendChild(b);return {d,b};}
function itemBox(onRemove){const b=el("div","item");const r=el("button","rm","Remove");r.type="button";r.onclick=onRemove;b.appendChild(r);return b;}

function buildEditor(){
  const root=document.getElementById("edIn"); root.innerHTML="";
  document.getElementById("tbTitle").textContent = data.nameTop+" "+data.nameEm+" · "+data.month;

  // COVER
  { const {d,b}=group("Cover &amp; intro",true);
    b.appendChild(frow(field("Issue",data.issue,v=>{data.issue=v;live();}),field("Month",data.month,v=>{data.month=v;live();},{hint:""})));
    b.appendChild(frow(field("Title line 1",data.nameTop,v=>{data.nameTop=v;live();}),field("Title line 2 (red)",data.nameEm,v=>{data.nameEm=v;live();})));
    b.appendChild(field("Tagline",data.tagline,v=>{data.tagline=v;live();},{area:true}));
    b.appendChild(field("Cities (comma separated)",data.cities.join(", "),v=>{data.cities=v.split(",").map(s=>s.trim()).filter(Boolean);live();}));
    b.appendChild(field("Editor's note",data.editorNote,v=>{data.editorNote=v;live();},{area:true,hint:"Use <b>…</b> for bold."}));
    root.appendChild(d); }

  // 01 GLANCE
  { const {d,b}=group("01 · At a glance (KPI cards)");
    b.appendChild(field("Heading",data.glance.heading,v=>{data.glance.heading=v;live();}));
    b.appendChild(field("Intro line",data.glance.lede,v=>{data.glance.lede=v;live();},{area:true}));
    const list=el("div"); b.appendChild(list);
    function drawKpis(){ list.innerHTML="";
      data.glance.kpis.forEach((k,i)=>{ const box=itemBox(()=>{data.glance.kpis.splice(i,1);drawKpis();live();});
        box.appendChild(field("Label",k.label,v=>{k.label=v;live();}));
        box.appendChild(frow(
          field("Prefix",k.prefix,v=>{k.prefix=v;live();}),
          field("Value",k.value,v=>{k.value=v;live();},{type:"number"}),
          field("Dec",k.dec,v=>{k.dec=v;live();},{type:"number"}),
          field("Suffix",k.suffix,v=>{k.suffix=v;live();})));
        box.appendChild(field("Delta text",k.delta,v=>{k.delta=v;live();}));
        box.appendChild(selectField("Delta colour",k.good===false?"amber (needs work)":"green (good)",["green (good)","amber (needs work)"],v=>{k.good=!v.startsWith("amber");live();}));
        list.appendChild(box); }); }
    drawKpis();
    const add=el("button","additem","+ Add KPI card");add.type="button";
    add.onclick=()=>{data.glance.kpis.push({label:"New metric",prefix:"₹",value:0,dec:0,suffix:"",delta:"▼ 0% MoM",good:true});drawKpis();live();};
    b.appendChild(add); root.appendChild(d); }

  // 02 CITY COST
  { const {d,b}=group("02 · Cost by city");
    b.appendChild(field("Heading",data.cityCost.heading,v=>{data.cityCost.heading=v;live();}));
    b.appendChild(field("Intro line",data.cityCost.lede,v=>{data.cityCost.lede=v;live();},{area:true}));
    const list=el("div");b.appendChild(list);
    function drawRows(){ list.innerHTML="";
      data.cityCost.rows.forEach((r,i)=>{ const box=itemBox(()=>{data.cityCost.rows.splice(i,1);drawRows();live();});
        box.appendChild(field("City name",r.name,v=>{r.name=v;live();}));
        box.appendChild(field("Value label",r.value,v=>{r.value=v;live();},{hint:"e.g. ₹82.4 L · 58%"}));
        box.appendChild(frow(
          field("Bar %",r.pct,v=>{r.pct=v;live();},{type:"number"}),
          selectField("Colour",r.color,["blr","ncr","hyd","alt"],v=>{r.color=v;live();})));
        list.appendChild(box); }); }
    drawRows();
    const add=el("button","additem","+ Add city");add.type="button";
    add.onclick=()=>{data.cityCost.rows.push({name:"New city",value:"₹0 L · 0%",pct:0,color:"alt"});drawRows();live();};
    b.appendChild(add);
    b.appendChild(field("Footnote",data.cityCost.note,v=>{data.cityCost.note=v;live();},{area:true}));
    root.appendChild(d); }

  // 03 SAVINGS
  { const {d,b}=group("03 · Savings");
    b.appendChild(field("Heading",data.savings.heading,v=>{data.savings.heading=v;live();}));
    b.appendChild(frow(
      field("Total prefix",data.savings.total.prefix,v=>{data.savings.total.prefix=v;live();}),
      field("Total value",data.savings.total.value,v=>{data.savings.total.value=v;live();},{type:"number"}),
      field("Dec",data.savings.total.dec,v=>{data.savings.total.dec=v;live();},{type:"number"}),
      field("Suffix",data.savings.total.suffix,v=>{data.savings.total.suffix=v;live();})));
    b.appendChild(field("Total label",data.savings.total.label,v=>{data.savings.total.label=v;live();},{area:true}));
    const list=el("div");b.appendChild(list);
    function drawSav(){ list.innerHTML="";
      data.savings.items.forEach((s,i)=>{ const box=itemBox(()=>{data.savings.items.splice(i,1);drawSav();live();});
        box.appendChild(frow(field("Amount",s.value,v=>{s.value=v;live();}),field("Title",s.name,v=>{s.name=v;live();})));
        box.appendChild(field("Note",s.note,v=>{s.note=v;live();},{area:true}));
        list.appendChild(box); }); }
    drawSav();
    const add=el("button","additem","+ Add saving");add.type="button";
    add.onclick=()=>{data.savings.items.push({value:"₹0 L",name:"New saving",note:""});drawSav();live();};
    b.appendChild(add); root.appendChild(d); }

  // 04 INITIATIVES
  { const {d,b}=group("04 · Initiatives");
    b.appendChild(field("Heading",data.initiatives.heading,v=>{data.initiatives.heading=v;live();}));
    const list=el("div");b.appendChild(list);
    function drawInit(){ list.innerHTML="";
      data.initiatives.items.forEach((it,i)=>{ const box=itemBox(()=>{data.initiatives.items.splice(i,1);drawInit();live();});
        box.appendChild(frow(field("Title",it.title,v=>{it.title=v;live();}),field("Tag",it.tag,v=>{it.tag=v;live();},{hint:"e.g. Live"})));
        box.appendChild(field("Description",it.body,v=>{it.body=v;live();},{area:true}));
        list.appendChild(box); }); }
    drawInit();
    const add=el("button","additem","+ Add initiative");add.type="button";
    add.onclick=()=>{data.initiatives.items.push({title:"New initiative",tag:"Live",body:""});drawInit();live();};
    b.appendChild(add); root.appendChild(d); }

  // 05 WINS & MISSES
  { const {d,b}=group("05 · Wins &amp; misses");
    b.appendChild(field("Heading",data.review.heading,v=>{data.review.heading=v;live();}));
    ["well","miss"].forEach(key=>{
      b.appendChild(el("div","hint",key==="well"?"WENT WELL":"NEEDS WORK"));
      const list=el("div");b.appendChild(list);
      function draw(){ list.innerHTML="";
        data.review[key].forEach((x,i)=>{ const box=itemBox(()=>{data.review[key].splice(i,1);draw();live();});
          box.appendChild(field("Point",x,v=>{data.review[key][i]=v;live();},{area:true,hint:"Use <b>…</b> for bold."}));
          list.appendChild(box); }); }
      draw();
      const add=el("button","additem","+ Add "+(key==="well"?"win":"miss"));add.type="button";
      add.onclick=()=>{data.review[key].push("<b>New point</b> — detail.");draw();live();};
      b.appendChild(add);
    });
    root.appendChild(d); }

  // 06 AHEAD
  { const {d,b}=group("06 · What's next");
    b.appendChild(field("Heading",data.ahead.heading,v=>{data.ahead.heading=v;live();}));
    const list=el("div");b.appendChild(list);
    function draw(){ list.innerHTML="";
      data.ahead.items.forEach((x,i)=>{ const box=itemBox(()=>{data.ahead.items.splice(i,1);draw();live();});
        box.appendChild(field("Focus item",x,v=>{data.ahead.items[i]=v;live();},{area:true,hint:"Use <b>…</b> for bold."}));
        list.appendChild(box); }); }
    draw();
    const add=el("button","additem","+ Add focus item");add.type="button";
    add.onclick=()=>{data.ahead.items.push("<b>New focus</b> — detail.");draw();live();};
    b.appendChild(add); root.appendChild(d); }

  // SIGN-OFF
  { const {d,b}=group("Sign-off");
    b.appendChild(field("Line 1",data.signoff.line1,v=>{data.signoff.line1=v;live();}));
    b.appendChild(field("Line 2",data.signoff.line2,v=>{data.signoff.line2=v;live();},{area:true}));
    root.appendChild(d); }
}

/* ---------- EXPORT / IMPORT ---------- */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

function exportHTML(){
  const clone=document.documentElement.cloneNode(true);
  ["#view","#editor","#toolbar","#editPrompt"].forEach(sel=>clone.querySelector(sel)?.remove());
  // fresh empty mount for the published file
  const v=document.createElement("div");v.id="view";clone.querySelector("body").insertBefore(v,clone.querySelector("script"));
  const sc=[...clone.querySelectorAll("script")].find(s=>s.textContent.includes("/*C_S*/"));
  sc.textContent = sc.textContent.replace(/\/\*C_S\*\/[\s\S]*?\/\*C_E\*\//, "/*C_S*/"+JSON.stringify(data,null,2)+"/*C_E*/");
  download(`newsletter-${(data.month||'').replace(/\s+/g,'-').toLowerCase()}.html`,"<!DOCTYPE html>\n"+clone.outerHTML,"text/html");
}
function exportJSON(){ download(`newsletter-${(data.month||'').replace(/\s+/g,'-').toLowerCase()}.json`,JSON.stringify(data,null,2),"application/json"); }

/* ---------- BOOT ---------- */
render();
if(EDIT){
  document.body.classList.add("editing");
  buildEditor();
  render(); // final-state (no animation) in edit mode
  document.getElementById("btnDone").onclick=()=>{const u=new URL(location);u.searchParams.delete("edit");location.href=u.toString();};
  document.getElementById("btnExport").onclick=exportHTML;
  document.getElementById("btnJson").onclick=exportJSON;
  document.getElementById("btnReset").onclick=()=>{ if(confirm("Reset all content to defaults? Your draft will be cleared.")){localStorage.removeItem(DRAFT_KEY);data=structuredClone(DEFAULTS);buildEditor();render();} };
  document.getElementById("btnImport").onclick=()=>document.getElementById("fileImport").click();
  document.getElementById("fileImport").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{data=JSON.parse(r.result);buildEditor();live();}catch(err){alert("Invalid JSON file.");}};r.readAsText(f);};
} else {
  const p=document.getElementById("editPrompt"); p.style.display="block";
  p.onclick=()=>{const u=new URL(location);u.searchParams.set("edit","1");location.href=u.toString();};
}
</script>
