<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Bounce Service Info</title>
<link rel="icon" type="image/png" href="/bounce-service-info/bounce-logo.png">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#0f172a; --muted:#64748b; --red:#dc2626; --border:#e5e7eb; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family: Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; padding:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px 32px; max-width:440px; width:100%; text-align:center; }
  img { height:64px; width:auto; }
  .code { font-size:13px; font-weight:700; color:var(--red); letter-spacing:.08em; margin-top:18px; }
  h1 { font-size:22px; margin:6px 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 22px; }
  a.btn { display:inline-block; background:var(--red); color:#fff; text-decoration:none; font-weight:600; font-size:14px; padding:11px 20px; border-radius:10px; }
  a.btn:hover { filter:brightness(.95); }
  .help { margin-top:16px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <img src="/bounce-service-info/bounce-logo.png" alt="Bounce Daily" onerror="this.remove()">
    <div class="code">ERROR 404</div>
    <h1>Page not found</h1>
    <p>This page doesn’t exist or has moved. The dashboard you want is probably on the Bounce Service Info home page.</p>
    <a class="btn" href="/bounce-service-info/">Go to Bounce Service Info</a>
    <div class="help">Still stuck? Contact the admin: nithish@bounceshare.com</div>
  </div>
</body>
</html>
