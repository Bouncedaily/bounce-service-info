<!DOCTYPE html>
<html lang="en">
<head>
<script src="error-log.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIQC · Bounce Service Info</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="auth-guard.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--red:#dc2626;--red-bg:#fef2f2;--red-line:#fecaca;--green:#16a34a;--green-bg:#dcfce7;--amber-bg:#fef3c7;--amber:#92400e;--blue-bg:#dbeafe;--blue:#1e40af;--dark:#111827}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-red{background:#fee2e2;color:#991b1b}.p-green{background:var(--green-bg);color:#166534}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-grey{background:#f1f5f9;color:#334155}.p-indigo{background:#e0e7ff;color:#3730a3}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px}
.cat-A{background:var(--blue-bg);color:var(--blue)}.cat-P{background:var(--amber-bg);color:var(--amber)}.cat-W{background:#ede9fe;color:#5b21b6}.cat-F{background:#ecfccb;color:#3f6212}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn-sm{height:36px;padding:0 12px;font-size:13px}
.seg{display:inline-flex;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-size:13px;cursor:pointer}
.seg button.ok-on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.seg button.bad-on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:44px;border:1px solid #cbd5e1;border-radius:10px;padding:0 12px;background:#fff;width:100%}
textarea.inp{height:auto;min-height:60px;padding:10px}
.list{display:flex;flex-direction:column;gap:10px}
.jc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;width:100%}
.jc:hover{border-color:#cbd5e1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.grp{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.pt{padding:10px 12px;border-bottom:1px solid #f1f5f9;display:flex;flex-direction:column;gap:8px}
.pt:last-child{border-bottom:0}
.fail{background:var(--red-bg)}
.alert{background:var(--red-bg);border:1px solid var(--red-line);border-radius:10px;padding:10px 12px;color:#7f1d1d;font-size:13px}
.info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;color:#1e3a8a;font-size:13px}
.photo-btn{height:40px;border-radius:8px;border:1px dashed #94a3b8;background:#fff;color:#334155;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.photo-btn.req{border-color:#f87171;color:#b91c1c}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:54px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#f1f5f9;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700}.kpi .l{font-size:13px;font-weight:600}.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{background:var(--red-bg);border-color:var(--red-line)}
.blk-h{padding:11px 14px;background:var(--dark);color:#fff;font-weight:700;font-size:14px;border-radius:12px 12px 0 0}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:var(--muted);text-align:left;padding:9px 12px;font-size:12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid #f1f5f9;vertical-align:top}
.num{text-align:right}
.bar{height:10px;background:#f1f5f9;border-radius:999px}.bar>div{height:10px;background:var(--red);border-radius:999px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#b91c1c}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;display:none;max-width:90vw}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 4px}
.phone{max-width:560px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.filters .field{min-width:140px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.8);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay img{max-width:100%;max-height:90vh;border-radius:8px}
.picker{border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:240px;overflow:auto;background:#fff}
.picker button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #f1f5f9;background:#fff;padding:10px 12px;text-align:left;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">FIQC Dashboard</h1><div class="sub" id="who">Final inspection quality check</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" id="actions"></div>
  </div>
  <div class="small muted" id="stamp" style="margin:-6px 0 10px"></div>
  <div id="view"><span class="spin"></span>Loading…</div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hidden">

<script>
const SB_URL = 'https://fuslpeyhpmofzijrotkb.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1c2xwZXlocG1vZnppanJvdGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDg0NDgsImV4cCI6MjA5NDMyNDQ0OH0.IGtWV-bus0Tc1i3z7hWuFZEda06q8L31YyBgiOFujbs';
const POINTS = [
  ['Brakes & wheels', [['brake','Brake / brake sensor'],['tyre','Tyre pressure / condition'],['axle','Front & rear axle bolt'],['cone','Cone set / handle movement']]],
  ['Suspension & frame', [['susp','Front & rear suspension, no oil leak'],['stand','Side stand / main stand'],['damper','Rubber damper (battery stopper)']]],
  ['Electricals & controls', [['horn','Horn'],['lh','LH switch assembly'],['rh','RH switch assembly'],['throttle','Throttle assembly'],['motor','Motor / motor cable']]],
  ['Body & papers', [['plates','Number plates available'],['body','Body parts fitted properly']]]
];
const NOTFIT_REASONS = ['Old part still on the bike','Part not available in store','Entered by mistake','Part fitted on another bike','Other'];
const EXTRA_REASONS = ['Job card not updated','Part taken from another bike','Warranty / free replacement','Other'];
const CAT_NAME = {A:'Wear & tear',P:'Rider-payable',W:'Warranty',F:'Free'};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => n == null || n === '' ? '—' : '₹' + Math.round(+n).toLocaleString('en-IN');
const tFmt = d => d ? new Date(d).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';
const hm = d => d ? new Date(d).toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit'}) : '';
const catBadge = c => c ? `<span class="cat cat-${esc(c)}" title="${esc(CAT_NAME[c] || c)}">${esc(c)}</span>` : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500); }

async function token() { return (window.authGetValidToken ? await window.authGetValidToken() : '') || (window.authGetToken ? window.authGetToken() : ''); }
async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const t = await r.text(); let d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
  return d;
}

// ── Photos: compress on the phone, upload to private storage, view by signed link ──
function pickPhoto() {
  return new Promise(res => { const inp = $('#cam'); inp.value = ''; inp.onchange = () => res(inp.files && inp.files[0]); inp.click(); });
}
async function compress(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
}
async function uploadPhoto(prefix) {
  const f = await pickPhoto(); if (!f) return null;
  toast('Uploading photo…');
  const blob = await compress(f);
  const path = `${prefix}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const r = await fetch(`${SB_URL}/storage/v1/object/fiqc-photos/${path}`, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + await token(), 'Content-Type': 'image/jpeg' }, body: blob });
  if (!r.ok) { toast('Photo upload failed. Try again.'); return null; }
  PREVIEW[path] = URL.createObjectURL(blob); toast('Photo added');
  return path;
}
const PREVIEW = {}, SIGNED = {};
async function signed(path) {
  if (!path) return '';
  if (PREVIEW[path]) return PREVIEW[path];
  if (SIGNED[path]) return SIGNED[path];
  try {
    const r = await fetch(`${SB_URL}/storage/v1/object/sign/fiqc-photos/${path}`, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify({ expiresIn: 3600 }) });
    const d = await r.json(); SIGNED[path] = d.signedURL ? SB_URL + '/storage/v1' + d.signedURL : ''; return SIGNED[path];
  } catch (e) { return ''; }
}
async function fillThumbs(root) {
  for (const im of (root || document).querySelectorAll('img[data-photo]')) { if (!im.src) im.src = await signed(im.dataset.photo); }
}
function openPhoto(path) { signed(path).then(u => { if (!u) return; const o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = `<img src="${u}" alt="Photo">`; o.onclick = () => o.remove(); document.body.appendChild(o); }); }
const thumb = p => p ? `<img class="thumb" data-photo="${esc(p)}" alt="Photo" onclick="openPhoto('${esc(p)}')">` : '';

// ── State ──
const S = { me: null, tab: null, home: null, sub: 'stage1', job: null, form: null, dash: null, df: null, hub: null };

// The dashboard is the main view. Checks and Hub team open only for people with that access.
function setTabs() {
  const m = S.me;
  if (!S.tab || (S.tab === 'checks' && !m.check) || (S.tab === 'hub' && !m.hub)) S.tab = 'dash';
  $('#title').textContent = { dash: 'FIQC Dashboard', checks: 'FIQC checks', hub: 'Hub team: re-check requests' }[S.tab];
  const b = [];
  if (S.tab !== 'dash') b.push(`<button class="btn btn-sm" onclick="go('dash')"><i class="ti ti-arrow-left"></i>Back to dashboard</button>`);
  if (m.check && S.tab !== 'checks') b.push(`<button class="btn btn-sm btn-red" onclick="go('checks')"><i class="ti ti-clipboard-check"></i>Open FIQC checks</button>`);
  if (m.hub && S.tab !== 'hub') b.push(`<button class="btn btn-sm btn-dark" onclick="go('hub')"><i class="ti ti-tool"></i>Hub team: re-check requests</button>`);
  $('#actions').innerHTML = b.join('');
}
function go(t) { S.tab = t; S.job = null; S.form = null; setTabs(); render(); window.scrollTo(0, 0); if (t === 'checks') reloadHome(); }

async function boot() {
  try {
    S.home = await rpc('fiqc_home');
    S.me = S.home.me;
    $('#who').textContent = `${S.me.name} · ${S.me.hubs && S.me.hubs.length ? S.me.hubs.join(', ') : (S.me.cities && S.me.cities.length ? S.me.cities.join(', ') : 'All hubs')}`;
    setTabs(); render();
  } catch (e) {
    $('#view').innerHTML = `<div class="card pad"><b>No FIQC access</b><div class="muted" style="margin-top:6px">Ask the admin to give you FIQC access (checker, hub team or dashboard) in Admin → Allowed users.</div><div class="small err" style="margin-top:6px">${esc(e.message)}</div></div>`;
  }
}
function render() {
  $('#stamp').textContent = 'Updated ' + hm(new Date());
  if (S.tab === 'checks') return S.job ? renderJob() : renderHome();
  if (S.tab === 'hub') return renderHub();
  if (S.tab === 'dash') return renderDash();
  $('#view').innerHTML = '<div class="card pad">No FIQC access.</div>';
}

// ════════════ CHECKS: home ════════════
async function reloadHome() { try { S.home = await rpc('fiqc_home'); } catch (e) { toast(e.message); } render(); }
function renderHome() {
  const h = S.home, cnt = { stage1: h.stage1.length, recheck: h.recheck.length, stage2: h.stage2.length, done: h.done.length };
  const subs = [['stage1', 'Stage 1'], ['recheck', 'Re-check'], ['stage2', 'Stage 2 (billed)'], ['done', 'Done today']];
  const alerts = h.rfd_alerts || [];
  let list = '';
  if (S.sub === 'stage1') list = h.stage1.map(j => card(j.id, j.reg_number, `JC ${j.job_card_number} · Closed ${tFmt(j.closed_at)} · ${j.technician || '—'} · ${j.parts} part${j.parts === 1 ? '' : 's'}`, j.hub_name,
      j.jc_status === 'Closed - Waiting for Approval' ? '<span class="pill p-green">Waiting for approval</span>' : `<span class="pill p-amber">Approved before FIQC</span>`,
      j.jc_status !== 'Closed - Waiting for Approval' ? `Now: ${esc(j.jc_status || '')}` : '')).join('');
  if (S.sub === 'recheck') list = h.recheck.map(j => card(j.id, j.reg_number, `JC ${j.job_card_number} · Rejected ${tFmt(j.last_rejected_at)}${j.failed ? ' (' + esc(j.failed) + ')' : ''} · ${esc(j.technician || '—')}`, j.hub_name,
      `<span class="pill ${j.stage1_state === 'ready' ? 'p-blue' : 'p-red'}">${j.stage1_state === 'ready' ? 'Ready for re-check' : 'Waiting for fix'} · attempt ${j.stage1_attempts + 1}</span>`,
      j.stage1_state === 'ready' ? (j.ready_reason === 'jc_reclosed' ? `Ready: job card re-closed in DMS ${tFmt(j.ready_at)}` : `Ready: marked fixed by ${esc(j.ready_by)} ${tFmt(j.ready_at)}`) : 'Not fixed yet: you can still re-check if it is fixed')).join('');
  if (S.sub === 'stage2') list = h.stage2.map(j => card(j.id, j.reg_number, `JC ${j.job_card_number} · Billed ${tFmt(j.billed_at)} · ${esc(j.technician || '—')}`, j.hub_name,
      '<span class="pill p-indigo">Billed, check parts</span>', j.stage1_state !== 'approved' ? 'Stage 1 not approved' : '')).join('');
  if (S.sub === 'done') list = h.done.map(c => `<div class="jc" style="cursor:default"><div class="row"><b>${esc(c.reg_number)}</b><span class="pill ${c.result === 'approved' ? 'p-green' : 'p-red'}">${c.result === 'approved' ? 'Approved' : 'Rejected'}</span></div><div class="small muted">Stage ${c.stage}${c.attempt > 1 ? ' · attempt ' + c.attempt : ''} · JC ${esc(c.job_card_number)} · ${esc(c.hub_name)} · ${hm(c.checked_at)} by ${esc(c.checked_by_name)}</div></div>`).join('');
  $('#view').innerHTML = `<div class="phone">
    <div class="field"><label for="reg">Vehicle number</label><div style="display:flex;gap:8px"><input id="reg" class="inp" placeholder="e.g. UP32QC1456" autocomplete="off" onkeydown="if(event.key==='Enter')findReg()"><button class="btn btn-dark" onclick="findReg()">Open</button></div></div>
    ${alerts.length ? `<div class="alert" style="margin-top:10px"><b><i class="ti ti-alert-triangle"></i> ${alerts.length} bike${alerts.length === 1 ? '' : 's'} moved to RFD before FIQC approval</b><div>${alerts.slice(0, 5).map(a => `${esc(a.reg_number)} (${esc(a.fiqc_at_time === 'Not checked' ? 'not checked' : a.fiqc_at_time.toLowerCase())}, ${tFmt(a.moved_at)})`).join(' · ')}. Check them before deployment.</div></div>` : ''}
    <div class="chips" style="margin:12px 0">${subs.map(([k, l]) => `<button class="chip ${S.sub === k ? 'on' : ''}" onclick="S.sub='${k}';render()">${l} · ${cnt[k]}</button>`).join('')}</div>
    <div class="small muted" style="margin-bottom:8px">${{stage1: 'Job cards closed, waiting for hub manager approval (last 7 days). Oldest first.', recheck: 'Bikes rejected by FIQC. Ready ones are at the top.', stage2: 'Billed job cards: check billed parts against the bike.', done: 'Checks submitted today.'}[S.sub]}</div>
    <div class="list">${list || '<div class="card pad muted">Nothing here right now.</div>'}</div>
    <div style="margin-top:12px"><button class="btn btn-sm" onclick="reloadHome()"><i class="ti ti-refresh"></i>Refresh</button></div></div>`;
}
function card(id, reg, line, hub, pill, extra) {
  return `<button class="jc" onclick="openJob(${id})"><div class="row"><b style="font-size:15px">${esc(reg)}</b>${pill}</div><div class="small muted">${line} · ${esc(hub || '')}</div>${extra ? `<div class="small" style="color:#92400e">${extra}</div>` : ''}</button>`;
}
async function findReg() {
  const reg = ($('#reg').value || '').trim(); if (!reg) return;
  try {
    const d = await rpc('fiqc_job', { p_reg: reg });
    if (!d.found) { const f = d.fleet; toast(f ? `${f.reg_number}: no closed job card for FIQC. Fleet status ${f.status}${f.oos_sub_status ? ' (' + f.oos_sub_status + ')' : ''}, ${f.hub_name}.` : 'Vehicle not found. Check the number.'); return; }
    startJob(d);
  } catch (e) { toast(e.message); }
}
async function openJob(id) { try { startJob(await rpc('fiqc_job', { p_job_id: id })); } catch (e) { toast(e.message); } }

// ════════════ CHECKS: one job card ════════════
function startJob(d) {
  const j = d.job;
  let mode = 'stage1';
  if (j.stage1_state === 'approved' && j.stage2_state === 'pending') mode = 'stage2';
  else if (j.stage1_state === 'rejected' || j.stage1_state === 'ready') mode = 'recheck';
  else if (j.stage1_state === 'approved') mode = 'done';
  if (S.sub === 'stage2' && j.stage2_state === 'pending') mode = 'stage2';
  const lastS1 = [...(d.checks || [])].filter(c => c.stage === 1).pop();
  const failedKeys = lastS1 && lastS1.result === 'rejected' ? (lastS1.failed || []).map(f => f.key) : [];
  const parts = (mode === 'stage2' ? d.billed : d.items).map(p => ({ kind: 'on_jc', code: p.code || null, name: p.name, cat: p.cat, qty: +p.qty || 1, unit_price: p.unit_price, fitted: true, reason: '', photo: null }));
  S.job = d;
  S.form = { mode, scope: mode === 'recheck' && failedKeys.length ? 'failed' : 'all', failedKeys, lastS1, points: {}, parts, extra: [], vehicle_photo: null, note: '', lat: null, lng: null };

}
function renderDashData(d) {
  const f = S.df, box = $('#dash');
  const cities = [...new Set((d.hub_list || []).map(h => h.city).filter(Boolean))].sort();
  $('#dcity').innerHTML = '<option value="">All cities</option>' + cities.map(c => `<option ${c === f.city ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#dhub').innerHTML = '<option value="">All hubs</option>' + (d.hub_list || []).filter(h => !f.city || h.city === f.city).map(h => h.hub).filter(Boolean).sort().map(h => `<option ${h === f.hub ? 'selected' : ''}>${esc(h)}</option>`).join('');
  $('#dtech').innerHTML = '<option value="">All</option>' + (d.tech_list || []).sort().map(t => `<option ${t === f.tech ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const k = d.kpi, r = d.rfd, jp = d.jc_vs_physical;
  const fix = r.avg_fix_mins == null ? '—' : (r.avg_fix_mins >= 60 ? Math.floor(r.avg_fix_mins / 60) + ' h ' + (r.avg_fix_mins % 60) + ' m' : r.avg_fix_mins + ' m');
  const maxFail = Math.max(1, ...(d.failed_checks || []).map(x => x.n));
  box.innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="v">${k.checked}</div><div class="l">Vehicles checked</div><div class="s">${k.approved} approved · ${k.rejected_first} rejected first time</div></div>
    <div class="kpi"><div class="v">${k.first_time_pct == null ? '—' : k.first_time_pct + '%'}</div><div class="l">Approved first time</div><div class="s">Stage 1, first check</div></div>
    <div class="kpi"><div class="v" style="color:#92400e">${inr(k.billed_not_fitted)}</div><div class="l">On JC / billed, not fitted</div><div class="s">${k.billed_not_fitted_n} parts on ${k.billed_not_fitted_bikes} bikes</div></div>
    <div class="kpi"><div class="v" style="color:#92400e">${inr(k.fitted_not_billed)}</div><div class="l">Fitted, not on JC</div><div class="s">${k.fitted_not_billed_n} parts on ${k.fitted_not_billed_bikes} bikes</div></div>
    <div class="kpi"><div class="v">${k.before_approval_pct == null ? '—' : k.before_approval_pct + '%'}</div><div class="l">Stage 1 before approval</div><div class="s">${k.approved_before_fiqc} approved by hub manager before FIQC</div></div>
    <div class="kpi ${(k.rfd_before + k.rfd_after_reject + k.oos_after_approval) ? 'bad' : ''}"><div class="v" style="color:${(k.rfd_before + k.rfd_after_reject + k.oos_after_approval) ? '#991b1b' : 'inherit'}">${k.rfd_before + k.rfd_after_reject + k.oos_after_approval}</div><div class="l">RFD status issues</div><div class="s">${k.rfd_before} RFD before approval · ${k.rfd_after_reject} RFD after rejection · ${k.oos_after_approval} still in OOS after approval</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="blk-h">Hub RFD validation</div><div class="pad" style="padding-top:4px">
      <div class="kv"><span>Total vehicles approached</span><b>${r.approached}</b></div>
      <div class="kv"><span>Rejected (first check)</span><b style="color:#991b1b">${r.rejected_first}</b></div>
      <div class="kv"><span>Approved first time</span><b style="color:#166534">${r.approved_first}</b></div>
      <div class="kv"><span>Approved after re-check</span><b style="color:#166534">${r.approved_after}</b></div>
      <div class="kv"><span>Waiting for re-check (now)</span><b style="color:#92400e">${r.waiting}</b></div>
      <div class="kv"><span>Re-check rejected again</span><b style="color:#991b1b">${r.rejected_again}</b></div>
      <div class="kv"><span>Average time to fix (rejected → approved)</span><b>${fix}</b></div>
      <div class="lbl">Rejection remarks</div>
      <div style="display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px">${(r.remarks || []).slice(0, 12).map(x => `<b>${esc(x.reg)}</b><span>${esc(x.text || '')}${x.attempt > 1 ? ' <span class="pill p-grey">attempt ' + x.attempt + '</span>' : ''}</span>`).join('') || '<span class="muted">None</span>'}</div>
      ${(r.remarks || []).length > 12 ? `<div class="small muted" style="margin-top:6px">+ ${r.remarks.length - 12} more</div>` : ''}
    </div></div>
    <div class="card"><div class="blk-h">JC vs physical consumption</div><div class="pad" style="padding-top:4px">
      <table><thead><tr><th>Parts consumed as per JC</th><th class="num">Total bikes</th><th class="num">Price</th></tr></thead><tbody>
        <tr><td>Billed parts (on JC and fitted)</td><td class="num">${jp.billed_bikes}</td><td class="num">${inr(jp.billed_value)}</td></tr>
        <tr><td>Unbilled parts (fitted, not on JC)</td><td class="num">${jp.unbilled_bikes}</td><td class="num" style="color:#92400e;font-weight:600">${inr(jp.unbilled_value)}</td></tr>
        <tr><td>On JC / billed but not fitted</td><td class="num">${jp.notfitted_bikes}</td><td class="num" style="color:#92400e;font-weight:600">${inr(jp.notfitted_value)}</td></tr></tbody></table>
      <div class="lbl">Reason for difference</div>
      ${(jp.reasons || []).map(x => `<div class="kv" style="border:0;padding:4px 0"><span>${esc(x.reason)}</span><b>${x.n}</b></div>`).join('') || '<div class="muted small">No differences</div>'}
    </div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="pad row" style="border-bottom:1px solid var(--line);flex-wrap:wrap"><b style="font-size:15px">RFD status vs FIQC</b><span class="small muted">OOS → RFD moves compared with the FIQC result. Counted at hubs where FIQC is live.</span></div>
    <div class="pad" style="padding-bottom:0"><div class="chips">${[['', 'All'], ['Moved to RFD before FIQC approval', 'RFD before approval · ' + k.rfd_before], ['Moved to RFD after FIQC rejection', 'RFD after rejection · ' + k.rfd_after_reject], ['Still in OOS after FIQC approval', 'Still in OOS after approval · ' + k.oos_after_approval]].map(([v, l]) => `<button class="chip ${(S.rs || '') === v ? 'on' : ''}" onclick="S.rs='${v}';loadDashRender()">${l}</button>`).join('')}</div></div>
    <div class="tbl" style="margin-top:10px"><table style="min-width:960px"><thead><tr><th>Vehicle · JC</th><th>Hub</th><th>Status</th><th>When</th><th>Marked by</th><th>FIQC at that time</th><th>FIQC approved</th><th>Technician</th></tr></thead><tbody>
    ${(d.rfd_status || []).filter(x => !S.rs || x.status === S.rs).map(x => `<tr><td><b>${esc(x.reg_number)}</b> · ${esc(x.job_card_number)}</td><td>${esc(x.hub_name)}</td>
      <td><span class="pill ${x.status === 'Moved to RFD before FIQC approval' ? 'p-amber' : x.status === 'Moved to RFD after FIQC rejection' ? 'p-red' : 'p-blue'}">${esc(x.status)}</span>${x.deployed ? ' <span class="pill p-red">Deployed</span>' : ''}</td>
      <td>${x.status === 'Still in OOS after FIQC approval' ? 'Approved ' + tFmt(x.event_at) + (x.hours_waiting != null ? `<div class="small muted">${x.hours_waiting >= 24 ? Math.floor(x.hours_waiting / 24) + ' d ' + Math.round(x.hours_waiting % 24) + ' h' : Math.round(x.hours_waiting) + ' h'} in OOS since</div>` : '') : 'Moved to RFD ' + tFmt(x.event_at)}</td>
      <td>${esc(x.moved_by || '—')}</td><td>${esc(x.fiqc_at_time)}</td><td>${x.approved_at ? tFmt(x.approved_at) : 'Not yet'}</td><td>${esc(x.technician || '—')}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">None in this period.</td></tr>'}
    </tbody></table></div></div>
  <div class="card" style="margin-top:14px"><div class="pad row" style="border-bottom:1px solid var(--line)"><b style="font-size:15px">Parts mismatches</b><span class="small muted">Every part where the job card and the bike do not match</span></div>
    <div class="tbl"><table style="min-width:900px"><thead><tr><th>Vehicle · JC</th><th>Stage</th><th>Part</th><th>Type</th><th>Reason</th><th>Technician</th><th class="num">₹</th><th>Photo</th></tr></thead><tbody>
    ${(d.mismatches || []).map(x => `<tr><td><b>${esc(x.reg)}</b> · ${esc(x.jc)}</td><td>${x.stage}</td><td>${catBadge(x.cat)}${esc(x.part)}${+x.qty > 1 ? ' ×' + x.qty : ''}</td><td><span class="pill ${x.type === 'Fitted, not on JC' ? 'p-amber' : 'p-red'}">${esc(x.type)}</span></td><td>${esc(x.reason || '—')}</td><td>${esc(x.technician || '—')}</td><td class="num">${x.value ? inr(x.value) : '—'}</td><td>${x.photo ? `<a href="#" onclick="openPhoto('${esc(x.photo)}');return false">View</a>` : '—'}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No mismatches in this period.</td></tr>'}
    </tbody></table></div></div>
  <div class="grid2" style="margin-top:14px">
    <div class="card"><div class="pad" style="border-bottom:1px solid var(--line)"><b style="font-size:15px">By technician</b></div><div class="tbl"><table><thead><tr><th>Technician</th><th class="num">Checked</th><th class="num">Approved first time</th><th>Most failed check</th></tr></thead><tbody>
      ${(d.technicians || []).map(t => `<tr><td>${esc(t.technician)}</td><td class="num">${t.checked}</td><td class="num">${t.first_time_pct == null ? '—' : t.first_time_pct + '%'}</td><td>${esc(t.top_fail || '—')}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No checks in this period.</td></tr>'}
    </tbody></table></div></div>
    <div class="card"><div class="pad" style="border-bottom:1px solid var(--line)"><b style="font-size:15px">Most failed checks</b></div><div class="pad" style="display:flex;flex-direction:column;gap:10px">
      ${(d.failed_checks || []).map(x => `<div style="display:grid;grid-template-columns:minmax(120px,200px) 1fr 30px;align-items:center;gap:10px"><span>${esc(x.label)}</span><div class="bar"><div style="width:${Math.round(x.n / maxFail * 100)}%"></div></div><b>${x.n}</b></div>`).join('') || '<span class="muted">No failed checks in this period.</span>'}
    </div></div>
  </div>`;
}

let _booted = false;
function bootOnce() { if (_booted) return; _booted = true; boot(); }
window.addEventListener('auth-ready', bootOnce);
if (window.authGetValidToken) bootOnce();
</script>
</body>
</html>
